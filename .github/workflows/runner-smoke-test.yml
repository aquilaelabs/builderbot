name: runner smoke test

# Manual only — this is a proof that the self-hosted BuilderBot runner picks
# up work and has the toolchain it advertises. Run it from the Actions tab:
# "runner smoke test" -> Run workflow.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, builderbot]
    steps:
      - uses: actions/checkout@v5

      - name: Where am I
        run: |
          echo "hostname : $(hostname)"
          echo "user     : $(id -un) ($(id -u):$(id -g))"
          echo "workdir  : $PWD"

      - name: Toolchain
        run: |
          probe() { printf '  %-12s %s\n' "$1" "$("${@:2}" 2>/dev/null | head -1 || echo 'MISSING')"; }
          probe claude     claude --version
          probe node       node --version
          probe python     python3 --version
          probe java       java --version
          probe git        git --version
          probe gh         gh --version
          probe playwright playwright --version
          probe adb        adb --version
          probe uv         uv --version

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls "${ANDROID_HOME}/platforms" 2>/dev/null || echo "no platforms dir"

      - name: Docker (expected unavailable unless the socket is mounted)
        continue-on-error: true
        run: docker info >/dev/null 2>&1 && echo "docker reachable" || echo "no docker socket — expected default"

      - name: Secrets must not be visible here
        run: |
          # The runner job runs as the same unprivileged user as a Claude
          # session, so the shielded PAT must be absent from this environment.
          if [ -n "${GITHUB_PAT:-}" ]; then
            echo "FAIL: GITHUB_PAT is visible to workflow jobs"; exit 1
          fi
          echo "ok: shielded PAT not present in the job environment"
