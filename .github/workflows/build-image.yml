name: build image

# A 40-minute hosted build bills against the plan's included minutes, so it
# runs only when something the image is actually built FROM changes: the
# allowlist below is exactly the Dockerfile's COPY sources plus the build
# definition itself. This used to be a paths-ignore, which charged a full
# build for every change to a workflow, dashboard doc or lint config that
# could not have altered the image.
on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/build-image.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/build-image.yml"
  schedule:
    # Weekly rebuild so the base image, Claude Code and the runner stay fresh.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Pushing twice to a PR queued two 40-minute builds; only the newest result
# means anything, so cancel the superseded one.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The hosted runner ships ~25GB of toolchains this build never uses
      # (dotnet, the runner's own Android SDK, GHC, CodeQL). This image is
      # large enough that the export phase ran the disk dry at "exporting
      # layers" — silently, because a full disk kills the step before it can
      # say why. Reclaim the space first, and print the number so the next
      # capacity failure is a figure in the log rather than a mystery.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Explicitly keyed to main rather than {{is_default_branch}}: the
            # repo's default branch is a settings value that can differ from
            # the trunk this workflow builds, and silently losing the :latest
            # tag breaks every consumer pulling it.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No layer cache, deliberately. The GHA cache quota is 10GB per
          # repo and this image's layers alone exceed it, so every build's
          # cache export evicted the previous build's entry: all of the cost
          # at the end of each build (gigabytes written to the cache service,
          # plus a second on-disk copy of every layer during export), none of
          # the hits at the start of the next. Uncached is both faster and
          # lighter on disk here.
