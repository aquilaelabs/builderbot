name: build image

# A 40-minute hosted build bills against the plan's included minutes, so it
# runs only when something the image is actually built FROM changes: the
# allowlist below is exactly the Dockerfile's COPY sources plus the build
# definition itself. This used to be a paths-ignore, which charged a full
# build for every change to a workflow, dashboard doc or lint config that
# could not have altered the image.
on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/build-image.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/build-image.yml"
  schedule:
    # Weekly rebuild so the base image, Claude Code and the runner stay fresh.
    - cron: "0 6 * * 1"
  # The checkbox is off by default so a manual run is a cheap retry of a build
  # that failed. It used to be implicit — every dispatch rebuilt from scratch,
  # which gives every layer a new digest and makes the host re-pull the whole
  # image — and that is a surprise when the intent was only "run that again".
  # Worth knowing beside it: GitHub's *Re-run all jobs* keeps the original
  # `push` event, so a re-run always used the cache; only this button differed.
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Rebuild every layer from scratch (slow; the host then re-pulls the whole image)"
        type: boolean
        default: false

# Pushing twice to a PR queued two 40-minute builds; only the newest result
# means anything, so cancel the superseded one.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Read by the `record` job below, which is the only consumer: it runs on
    # the self-hosted runner and writes them somewhere a session inside the
    # container can read without a token.
    outputs:
      version: ${{ steps.ver.outputs.v }}
      digest: ${{ steps.push.outputs.digest }}
      elapsed: ${{ steps.elapsed.outputs.s }}

    steps:
      # Elapsed time is the only signal here for whether the layer cache was
      # actually used — nothing in the API reports a cache hit — and the two
      # cases are minutes apart: a scripts-only build reuses every toolchain
      # layer, a from-scratch one rebuilds all of them. Worth one variable.
      - name: Start the clock
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      # Full history, not the default depth-1: the version's ordinal is
      # `git rev-list --count HEAD`, and a shallow clone answers that with 1.
      # It would not fail — every build would just silently call itself
      # .dev.1, which is worse.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The hosted runner ships ~25GB of toolchains this build never uses
      # (dotnet, the runner's own Android SDK, GHC, CodeQL). This image was
      # large enough that the export phase ran the disk dry at "exporting
      # layers" — silently, because a full disk kills the step before it can
      # say why. Reclaim the space first, and print the number so the next
      # capacity failure is a figure in the log rather than a mystery.
      #
      # The image has since lost ~2.9GB compressed to the SDK share, which is
      # headroom rather than a reason to stop: this step costs seconds, and
      # what it protects against gives no error message. Note also that the
      # paths below are the RUNNER's preinstalled toolchains, unrelated to
      # what this image installs — /usr/local/lib/android is GitHub's Android
      # SDK, several GB, and is worth deleting no matter what we ship.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null
          df -h /

      - uses: docker/setup-buildx-action@v4

      # PR builds log in too, although they never push: they read the cache
      # manifest out of :latest, and the package is private. Same-repo PRs
      # get a token that can; this repo takes no fork PRs.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry refs must be lowercase and the repository name is not.
      - name: Derive cache ref
        id: cache
        run: |
          echo "ref=$(echo "$REGISTRY/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]'):latest" >> "$GITHUB_OUTPUT"

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Explicitly keyed to main rather than {{is_default_branch}}: the
            # repo's default branch is a settings value that can differ from
            # the trunk this workflow builds, and silently losing the :latest
            # tag breaks every consumer pulling it.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=schedule,pattern={{date 'YYYYMMDD'}}

      # What the image will say it is when someone asks it from the inside.
      # The commit is the one being built; the time is this build's, not the
      # commit's, because the weekly rebuild ships new packages under an
      # unchanged sha and "which of those two is on my box" is the question.
      - name: Stamp the build
        id: stamp
        run: echo "at=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_OUTPUT"

      # The ordered identity, derived the same way `bb version` derives it in
      # a checkout — see scripts/dashboard/version.py for why rev-list and not
      # a run number or `git describe`'s count. Kept as shell here rather than
      # calling into the module: this runs on a hosted runner with only the
      # repo checked out, before any image exists to run bb from.
      - name: Derive the version
        id: ver
        run: |
          target="$(head -1 VERSION 2>/dev/null | tr -d '[:space:]')"
          ordinal="$(git rev-list --count HEAD)"
          short="$(git rev-parse --short=7 HEAD)"
          if ! printf '%s' "$target" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::warning::no usable VERSION file; stamping the commit alone"
            v="$short"
          elif tag="$(git describe --tags --exact-match HEAD 2>/dev/null)"; then
            v="${tag#v}"
            if [ "$v" != "$target" ]; then
              echo "::warning::tag $tag disagrees with VERSION ($target) — stamping the tag, but one of them is wrong"
            fi
          else
            v="${target}-dev.${ordinal}+${short}"
          fi
          echo "built $v"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            IMAGE_REV=${{ github.sha }}
            IMAGE_BUILT=${{ steps.stamp.outputs.at }}
            IMAGE_VERSION=${{ steps.ver.outputs.v }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Inline cache, not the GHA cache. The GHA quota is 10GB per repo
          # and this image's layers alone exceeded it, so every build's cache
          # export evicted the previous build's entry: all of the cost, none
          # of the hits. A smaller image would now fit, but there is nothing
          # to go back for: this is a single-stage build, so every layer
          # worth caching ends up in the published image — which is precisely
          # what inline caches — and `mode=max`'s advantage, keeping
          # intermediate layers that never ship, does not exist here. Inline embeds the cache metadata in the pushed image
          # itself — no separate store, nothing to evict — and seeding from
          # :latest lets an unchanged prefix of the Dockerfile reuse the
          # previous build's layers digest-for-digest. That reuse is also
          # what keeps the host's pull small: scripts/ and config/ are COPY'd
          # last, so a scripts-only change re-downloads megabytes of tail
          # instead of every gigabyte of toolchain above it.
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: type=inline
          # The weekly build exists to pick up fresh packages, and a fully
          # cached rebuild of an unchanged Dockerfile would reuse every layer
          # and refresh nothing — so the schedule always pays for the full
          # rebuild; that is the once a week the big download buys something.
          # A dispatch pays it only when asked: "freshen it now" and "that run
          # died, run it again" arrive through the same button and want
          # opposite answers. `inputs.no_cache` is null on a push, and
          # `null == true` is false, so every other trigger stays cached.
          no-cache: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}

      - name: Stop the clock
        id: elapsed
        # always(), because the run worth reading afterwards is the one that
        # failed, and how long it got before dying is half of what it says.
        if: always()
        run: echo "s=$(( $(date +%s) - T0 ))" >> "$GITHUB_OUTPUT"

  # The build runs on a hosted runner — out of reach of the container that
  # will eventually run its image, and invisible from inside it. So this job
  # comes back to the box and writes the outcome where `bb ci-log` reads it.
  #
  # It is the answer to a question that had none: a session was asked why the
  # host re-pulled every layer, and could not see that three builds had failed
  # before this one, or which of them was a dispatch. Seconds of work on the
  # self-hosted runner, and the alternative is a PAT.
  record:
    needs: build
    # Failed, cancelled and skipped are exactly the outcomes worth recording.
    if: always()
    # The image is pushed by the time this runs, so nothing waits on it: with
    # the box down the job simply queues until the box is back, and records a
    # build that finished half an hour earlier.
    #
    # It can still lose a race, and did on its first live run: the runner takes
    # one job at a time, this one queued behind the same branch's lint, and the
    # operator updated the container — killing both — before it got a turn. The
    # loss is survivable by construction, because the outcome most likely to be
    # lost that way is a SUCCESS whose image is about to be recorded in
    # /config/image-log.tsv anyway. A failed build publishes nothing, so nobody
    # updates, so the runner stays up and the record gets written — which is
    # the case this job exists for.
    runs-on: [self-hosted, builderbot]
    # A bookkeeping job must not be able to paint a successful build red. It
    # still shows as failed on its own row, which is where a broken recorder
    # belongs — the run's status stays the build's.
    continue-on-error: true
    steps:
      - name: Archive the outcome where the container can read it
        shell: bash
        # Through env rather than interpolated into the script: the same rule
        # the dashboard follows for anything the web can reach, and it keeps
        # a workflow input out of a command line.
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
          BUILD_DIGEST: ${{ needs.build.outputs.digest }}
          BUILD_ELAPSED: ${{ needs.build.outputs.elapsed }}
          NO_CACHE: ${{ inputs.no_cache }}
        run: |
          dir="/config/ci-logs/${GITHUB_REPOSITORY##*/}"
          # A box with no /config volume should lose the record, not fail the
          # build over it — but it should say so rather than look successful.
          mkdir -p "$dir" || { echo "no writable /config — nothing archived"; exit 0; }
          log="$dir/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"

          case "$BUILD_ELAPSED" in
            ''|*[!0-9]*) took="unknown" ;;
            *) took="$((BUILD_ELAPSED / 60))m $((BUILD_ELAPSED % 60))s" ;;
          esac
          case "$GITHUB_EVENT_NAME" in
            schedule) cache="off — the weekly rebuild always is" ;;
            *) if [ "$NO_CACHE" = true ]; then
                 cache="off — the run asked for a full rebuild, so the host re-pulls everything"
               else
                 cache="seeded from :latest"
               fi ;;
          esac

          # The same header the lint workflow writes, because `bb ci-log` reads
          # both out of this directory and tells them apart by the first line.
          {
            echo "# ${GITHUB_WORKFLOW} — ${GITHUB_REPOSITORY}"
            echo "run:    ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            echo "event:  ${GITHUB_EVENT_NAME}  ref: ${GITHUB_REF}"
            echo "commit: ${GITHUB_SHA}"
            echo "opened: $(date -Is)"
            echo
            echo "version: ${BUILD_VERSION:--}"
            echo "digest:  ${BUILD_DIGEST:-not pushed}"
            echo "took:    ${took}"
            echo "cache:   ${cache}"
            echo
            echo "This is the build's outcome, not its console output: the build"
            echo "itself ran on a hosted runner, which keeps nothing this box can"
            echo "reach. The run page on GitHub has the log."
            echo
            printf 'result: %s\n' "$BUILD_RESULT"
            printf 'closed: %s\n' "$(date -Is)"
          } > "$log"
          cat "$log"

          # Twenty kept, the same as the lint workflow's, and counted over the
          # whole directory because both workflows write into it.
          find "$dir" -maxdepth 1 -name '*.log' -printf '%T@ %p\n' \
            | sort -rn | tail -n +21 | cut -d' ' -f2- | xargs -r rm -f
