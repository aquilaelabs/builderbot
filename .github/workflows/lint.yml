name: lint

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: |
          # Selected by shebang rather than by name. The list used to be a
          # hand-maintained enumeration of extensions and filenames, which fails
          # in the one direction that matters: an extensionless script added
          # later is simply never checked, and nothing says so. That is how
          # scripts/dashboard/bb-tty — which validates a browser-supplied
          # argument — went unlinted. A shebang cannot be forgotten.
          mapfile -t files < <(find scripts -type f -exec grep -lE '^#!.*\b(ba)?sh\b' {} + | sort)
          printf 'checking %s\n' "${files[@]}"
          shellcheck -x -S warning "${files[@]}"

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          # Ignores live in .hadolint.yaml, which hadolint picks up on its
          # own — one config for this job and for `bb lint`, so the two can
          # never disagree about what a clean Dockerfile is.

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check workflow files
        # The runner labels a runs-on may target live in .github/actionlint.yaml,
        # shared with `bb lint`.
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          echo "compose file is valid"
      - name: Validate Unraid template XML
        run: |
          python3 - <<'EOF'
          import xml.dom.minidom
          xml.dom.minidom.parse("unraid/builderbot.xml")
          print("unraid template is well-formed")
          EOF
