name: lint

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: |
          mapfile -t files < <(find scripts -type f \( -name '*.sh' -o -name 'bb' -o -name 'as-builder' -o -name 'mint-runner-token' \))
          printf 'checking %s\n' "${files[@]}"
          shellcheck -x -S warning "${files[@]}"

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          # DL3008/DL3013/DL3016: a rolling dev image deliberately tracks the
          #   newest apt/pip/npm packages rather than pinning them.
          # SC1091: shellcheck can't follow `. /etc/os-release`, which only
          #   exists inside the image being built.
          ignore: DL3008,DL3013,DL3016,SC1091

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          echo "compose file is valid"
      - name: Validate Unraid template XML
        run: |
          python3 - <<'EOF'
          import xml.dom.minidom
          xml.dom.minidom.parse("unraid/builderbot.xml")
          print("unraid template is well-formed")
          EOF
