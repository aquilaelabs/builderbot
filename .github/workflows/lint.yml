name: lint

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: |
          mapfile -t files < <(find scripts -type f \( -name '*.sh' -o -name 'bb' -o -name 'as-builder' \))
          printf 'checking %s\n' "${files[@]}"
          shellcheck -x -S warning "${files[@]}"

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          # DL3008: we deliberately don't pin apt versions in a rolling dev image
          ignore: DL3008,DL3013,DL3016

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          echo "compose file is valid"
