# The companion app, built on a node. The node's runner carries the JDK and
# the Android SDK from its toolchain store (the same environment every bb
# job gets), so the build is `gradlew` and nothing else. The APK lands in
# BuilderBot's own dist/ on the projects share when the runner's machine
# mounts it (the sandbox does, at /workspace), which is where the Artifacts
# tab lists it and where /api/meta points an app that finds itself behind.
# It is not uploaded as a workflow artifact: the ones worth keeping are the
# releases, whose files hang off the GitHub release itself, and a 14 MB
# artifact per push kept 90 days filled the account's 0.5 GB of Actions
# storage in a month (B669), which the self-hosted runner does nothing
# about, since it saves minutes and an artifact is billed by the GB-month
# whoever uploads it. A runner that does not mount the share says so in
# the log and the APK goes nowhere.
#
# On main only, for the paths the app is built from: a PR does not build it
# (the dashboard suite's appapi.mjs already holds the contract there), so
# the APK that ships is the one from the tree that merged.
name: android app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"
  # ...and for each release, attached to it under the release's version with
  # its sha256, for every controller on that version to fetch and offer
  # (R272 step 2, apps.py).
  release:
    types: [published]
  # A release whose APK did not land (v0.5.0's, B117) is built again from
  # its tag and attached by naming the tag here; left empty, a plain build.
  workflow_dispatch:
    inputs:
      tag:
        description: "a release to build from its tag and attach the APK to (empty: a plain build)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, bb-sandbox]
    timeout-minutes: 40
    # bash with pipefail (the default `bash -e` has it too, said here because
    # every step below pipes into tee, and a tee's success must not be the
    # step's).
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit (B274)
        with:
          fetch-depth: 0   # bb version counts commits
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Open a log this container can read afterwards
        # As dashboard.yml and lint.yml keep theirs, for `bb ci-log`: the
        # runner keeps no step output on disk, and a failed build of the app
        # on 11 Oct (run 38155552427) could be read nowhere but on GitHub,
        # which a session has no token for (B665).
        run: |
          set -o pipefail
          dir="${BB_CI_LOG_DIR:-}"
          if [ -z "$dir" ]; then
            if [ -w /config ]; then dir=/config/ci-logs; else dir="$HOME/ci-logs"; fi
          fi
          dir="$dir/${GITHUB_REPOSITORY##*/}"
          mkdir -p "$dir"
          log="$dir/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          echo "CI_LOG=$log" >> "$GITHUB_ENV"
          echo "CI_LOG_DIR=$dir" >> "$GITHUB_ENV"
          {
            echo "# ${GITHUB_WORKFLOW} on ${GITHUB_REPOSITORY}"
            echo "run:    ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            echo "event:  ${GITHUB_EVENT_NAME}  ref: ${GITHUB_REF}"
            echo "commit: ${GITHUB_SHA}"
            echo "opened: $(date -Is)"
            echo
          } > "$log"

      # One identity for the app and the thing it talks to. The APK's name,
      # its versionName and its versionCode all come from `bb version` here
      # rather than from three places that drift: the app said 0.1.0 on the
      # day the project reached 0.5.0. Passed in rather than left for gradle
      # to work out, so the build does not depend on what is on its PATH.
      - name: Read the repository's version
        id: v
        run: |
          # BB_RELAYED, because this is a CI checkout under the runner's work
          # directory and not a project the controller knows: without it `bb
          # version` tries to relay, finds no session, and answers nothing.
          # That is what shipped `builderbot-app-.apk`, an artifact named
          # after an empty string, from a build that reported success.
          # Every one falls back, so a version that cannot be read costs a
          # worse name and not a wrong one.
          sha="$(git rev-parse --short HEAD)"
          v="$(BB_RELAYED=1 bash scripts/bb version --file 2>/dev/null || true)"
          s="$(BB_RELAYED=1 bash scripts/bb version --semver 2>/dev/null || true)"
          c="$(BB_RELAYED=1 bash scripts/bb version --code 2>/dev/null || true)"
          {
            echo "file=${v:-$sha}"
            echo "semver=${s:-0.0.0-unknown+$sha}"
            echo "code=${c:-1}"
          } >> "$GITHUB_OUTPUT"

      # A release, signed with the repository's key, where the four secrets
      # are set; the debug APK, signed with this runner's own debug key,
      # where they are not, said in the log (B274: a debuggable build let
      # run-as and a debugger into the credential store, and an update
      # built on another runner failed with a signature mismatch).
      - name: Build the APK
        id: build
        working-directory: android
        env:
          BB_APP_KEYSTORE_B64: ${{ secrets.BB_APP_KEYSTORE_B64 }}
          BB_APP_KEYSTORE_PASSWORD: ${{ secrets.BB_APP_KEYSTORE_PASSWORD }}
          BB_APP_KEY_ALIAS: ${{ secrets.BB_APP_KEY_ALIAS }}
          BB_APP_KEY_PASSWORD: ${{ secrets.BB_APP_KEY_PASSWORD }}
        run: |
          set -o pipefail
          exec > >(tee -a "$CI_LOG") 2>&1
          echo "== Build the APK"
          if [ -n "$BB_APP_KEYSTORE_B64" ] && [ -n "$BB_APP_KEYSTORE_PASSWORD" ] && [ -n "$BB_APP_KEY_ALIAS" ]; then
            ks="$RUNNER_TEMP/bb-app.keystore"
            printf '%s' "$BB_APP_KEYSTORE_B64" | base64 -d > "$ks"
            BB_APP_KEYSTORE_FILE="$ks" ./gradlew --no-daemon --console=plain assembleRelease \
              -PbbVersion='${{ steps.v.outputs.semver }}' -PbbCode='${{ steps.v.outputs.code }}'
            rm -f "$ks"
            echo "apk=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "signed release build"
          else
            ./gradlew --no-daemon --console=plain assembleDebug \
              -PbbVersion='${{ steps.v.outputs.semver }}' -PbbCode='${{ steps.v.outputs.code }}'
            echo "apk=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "::warning::no BB_APP_KEYSTORE_B64 secret: this is a DEBUG build signed with this runner's own key; set the four BB_APP_* secrets for a release"
          fi

      - name: Name it by the repository's version
        id: name
        run: |
          exec > >(tee -a "$CI_LOG") 2>&1
          echo "== Name it by the repository's version"
          echo "file=builderbot-app-${{ steps.v.outputs.file }}.apk" >> "$GITHUB_OUTPUT"
          cp "android/${{ steps.build.outputs.apk }}" \
             "builderbot-app-${{ steps.v.outputs.file }}.apk"

      - name: Land it in BuilderBot's dist/ where the share is mounted
        run: |
          exec > >(tee -a "$CI_LOG") 2>&1
          echo "== Land it in BuilderBot's dist/"
          # The project is found by its remote, not its folder's name: the
          # folder is whatever the controller named it, and a name written
          # here went on landing APKs in an old project after a move (B105).
          proj=""
          for d in /workspace/*/; do
            url="$(git -c safe.directory='*' -C "$d" remote get-url origin 2>/dev/null || true)"
            case "$url" in *"$GITHUB_REPOSITORY"|*"$GITHUB_REPOSITORY.git") proj="${d%/}"; break ;; esac
          done
          # A copy kept for the dashboard, never the release's condition: a
          # dist/ this runner's account cannot write held v0.5.0's APK back
          # from the release (B117).
          if [ -n "$proj" ]; then
            if mkdir -p "$proj/dist" && cp "${{ steps.name.outputs.file }}" "$proj/dist/"; then
              echo "in $proj/dist/: ${{ steps.name.outputs.file }}"
            else
              echo "::warning::could not write $proj/dist/ as $(id -un), so the APK is not kept there; the release still gets it"
            fi
          else
            echo "::warning::no project on this runner's share has $GITHUB_REPOSITORY as its remote, so the APK went nowhere: it is not kept as a workflow artifact (B669)"
          fi

      - name: Attach it to the release with its sha256
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -o pipefail
          exec > >(tee -a "$CI_LOG") 2>&1
          echo "== Attach it to the release"
          f="builderbot-app-${TAG#v}.apk"
          cp "${{ steps.name.outputs.file }}" "$f"
          sha256sum "$f" > "$f.sha256"
          gh release upload "$TAG" "$f" "$f.sha256" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Close the log
        if: always()
        # Written whatever happened: "it failed and said nothing" is the case
        # this exists for. The last sixty runs are kept, shared by every
        # workflow that files under this repository.
        run: |
          [ -n "${CI_LOG:-}" ] || exit 0
          printf '\nresult: %s\nclosed: %s\n' "${{ job.status }}" "$(date -Is)" >> "$CI_LOG"
          find "$CI_LOG_DIR" -maxdepth 1 -name '*.log' -printf '%T@ %p\n' \
            | sort -rn | tail -n +61 | cut -d' ' -f2- | xargs -r rm -f
