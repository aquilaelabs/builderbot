# The companion app, built on a node. The node's runner carries the JDK and
# the Android SDK from its toolchain store (the same environment every bb
# job gets), so the build is `gradlew` and nothing else. The build is an
# UNSIGNED release APK, always: no key, alias or password is a GitHub secret
# (R106, the operator 22 Oct: four hand-set secrets failed three ways and one
# put a password in a public log). It lands in BuilderBot's own dist/ on the
# projects share when the runner's machine mounts it (the sandbox does, at
# /workspace), where the Artifacts tab lists it and bb sign can sign it.
#
# For a release, the unsigned APK is handed to the controller as a workflow
# artifact named bb-release-apk-TAG, kept three days: the controller that
# made the release fetches it, signs it with the project's own sideload key
# as bb sign does, and attaches it to the release with its sha256 and its
# certificate's fingerprint (releasesign.py). Nothing else is uploaded as an
# artifact: a 14 MB one per push kept 90 days filled the account's 0.5 GB of
# Actions storage in a month (B669).
#
# On main only, for the paths the app is built from: a PR does not build it
# (the dashboard suite's appapi.mjs already holds the contract there), so
# the APK that ships is the one from the tree that merged.
name: android app

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-app.yml"
  # ...and for each release, handed to the controller to sign and attach
  # under the release's version with its sha256, for every controller on
  # that version to fetch and offer (R272 step 2, apps.py).
  release:
    types: [published]
  # A release whose APK did not land (v0.5.0's, B117) is built again from
  # its tag and handed over by naming the tag here; left empty, a plain build.
  workflow_dispatch:
    inputs:
      tag:
        description: "a release to build from its tag and hand to the controller to sign (empty: a plain build)"
        required: false
        default: ""

# Read only: the controller attaches the signed APK with its own token.
permissions:
  contents: read

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, bb-sandbox]
    timeout-minutes: 40
    # bash with pipefail (the default `bash -e` has it too, said here because
    # every step below pipes into tee, and a tee's success must not be the
    # step's).
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit (B274)
        with:
          fetch-depth: 0   # bb version counts commits
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Open a log this container can read afterwards
        # As dashboard.yml and lint.yml keep theirs, for `bb ci-log`: the
        # runner keeps no step output on disk, and a failed build of the app
        # on 11 Oct (run 38155552427) could be read nowhere but on GitHub,
        # which a session has no token for (B665).
        run: |
          set -o pipefail
          dir="${BB_CI_LOG_DIR:-}"
          if [ -z "$dir" ]; then
            if [ -w /config ]; then dir=/config/ci-logs; else dir="$HOME/ci-logs"; fi
          fi
          dir="$dir/${GITHUB_REPOSITORY##*/}"
          mkdir -p "$dir"
          log="$dir/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          echo "CI_LOG=$log" >> "$GITHUB_ENV"
          echo "CI_LOG_DIR=$dir" >> "$GITHUB_ENV"
          {
            echo "# ${GITHUB_WORKFLOW} on ${GITHUB_REPOSITORY}"
            echo "run:    ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            echo "event:  ${GITHUB_EVENT_NAME}  ref: ${GITHUB_REF}"
            echo "commit: ${GITHUB_SHA}"
            echo "opened: $(date -Is)"
            echo
          } > "$log"

      # One identity for the app and the thing it talks to. The APK's name,
      # its versionName and its versionCode all come from `bb version` here
      # rather than from three places that drift: the app said 0.1.0 on the
      # day the project reached 0.5.0. Passed in rather than left for gradle
      # to work out, so the build does not depend on what is on its PATH.
      - name: Read the repository's version
        id: v
        run: |
          # BB_RELAYED, because this is a CI checkout under the runner's work
          # directory and not a project the controller knows: without it `bb
          # version` tries to relay, finds no session, and answers nothing.
          # That is what shipped `builderbot-app-.apk`, an artifact named
          # after an empty string, from a build that reported success.
          # Every one falls back, so a version that cannot be read costs a
          # worse name and not a wrong one.
          sha="$(git rev-parse --short HEAD)"
          v="$(BB_RELAYED=1 bash scripts/bb version --file 2>/dev/null || true)"
          s="$(BB_RELAYED=1 bash scripts/bb version --semver 2>/dev/null || true)"
          c="$(BB_RELAYED=1 bash scripts/bb version --code 2>/dev/null || true)"
          {
            echo "file=${v:-$sha}"
            echo "semver=${s:-0.0.0-unknown+$sha}"
            echo "code=${c:-1}"
          } >> "$GITHUB_OUTPUT"

      # Unsigned, always (R106): the release build type has no signing
      # config, so Gradle writes app-release-unsigned.apk, which installs
      # nowhere until it is signed. A debug build is never made here (B274:
      # a debuggable build let run-as and a debugger into the credential
      # store, and an update built on another runner failed to install).
      - name: Build the unsigned APK
        id: build
        working-directory: apps/android
        run: |
          set -o pipefail
          exec > >(tee -a "$CI_LOG") 2>&1
          echo "== Build the unsigned APK"
          ./gradlew --no-daemon --console=plain assembleRelease \
            -PbbVersion='${{ steps.v.outputs.semver }}' -PbbCode='${{ steps.v.outputs.code }}'
          echo "apk=app/build/outputs/apk/release/app-release-unsigned.apk" >> "$GITHUB_OUTPUT"

      - name: Name it by the repository's version
        id: name
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          exec > >(tee -a "$CI_LOG") 2>&1
          echo "== Name it by the repository's version"
          echo "file=builderbot-app-${{ steps.v.outputs.file }}-unsigned.apk" >> "$GITHUB_OUTPUT"
          cp "apps/android/${{ steps.build.outputs.apk }}" \
             "builderbot-app-${{ steps.v.outputs.file }}-unsigned.apk"
          # A release's own name, which the controller keeps less -unsigned
          # once it has signed it: builderbot-app-0.7.0.apk for v0.7.0.
          if [ -n "$TAG" ]; then
            mkdir -p release-apk
            cp "apps/android/${{ steps.build.outputs.apk }}" "release-apk/builderbot-app-${TAG#v}-unsigned.apk"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Land it in BuilderBot's dist/ where the share is mounted
        run: |
          exec > >(tee -a "$CI_LOG") 2>&1
          echo "== Land it in BuilderBot's dist/"
          # The project is found by its remote, not its folder's name: the
          # folder is whatever the controller named it, and a name written
          # here went on landing APKs in an old project after a move (B105).
          proj=""
          for d in /workspace/*/; do
            url="$(git -c safe.directory='*' -C "$d" remote get-url origin 2>/dev/null || true)"
            case "$url" in *"$GITHUB_REPOSITORY"|*"$GITHUB_REPOSITORY.git") proj="${d%/}"; break ;; esac
          done
          # A copy kept for the dashboard, never the release's condition: a
          # dist/ this runner's account cannot write held v0.5.0's APK back
          # from the release (B117).
          if [ -n "$proj" ]; then
            if mkdir -p "$proj/dist" && cp "${{ steps.name.outputs.file }}" "$proj/dist/"; then
              echo "in $proj/dist/: ${{ steps.name.outputs.file }}"
            else
              echo "::warning::could not write $proj/dist/ as $(id -un), so the APK is not kept there${{ steps.name.outputs.tag && '; the release still gets it' || '' }}"
            fi
          else
            echo "::warning::no project on this runner's share has $GITHUB_REPOSITORY as its remote, so the APK is not kept there"
          fi

      # The controller signs it and attaches it (releasesign.py): handed over
      # under the tag's name, for three days, which is the controller's
      # window to fetch it and nothing anybody installs.
      - name: Hand the release's unsigned APK to the controller to sign
        if: steps.name.outputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2, pinned by commit (B274)
        with:
          name: bb-release-apk-${{ steps.name.outputs.tag }}
          path: release-apk/*.apk
          retention-days: 3
          if-no-files-found: error

      - name: Close the log
        if: always()
        # Written whatever happened: "it failed and said nothing" is the case
        # this exists for. The last sixty runs are kept, shared by every
        # workflow that files under this repository.
        run: |
          [ -n "${CI_LOG:-}" ] || exit 0
          printf '\nresult: %s\nclosed: %s\n' "${{ job.status }}" "$(date -Is)" >> "$CI_LOG"
          find "$CI_LOG_DIR" -maxdepth 1 -name '*.log' -printf '%T@ %p\n' \
            | sort -rn | tail -n +61 | cut -d' ' -f2- | xargs -r rm -f
