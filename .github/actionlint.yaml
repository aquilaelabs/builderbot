# Labels the runners in BuilderBot's registry carry — this container's own and
# every node runner's. Generated by `bb ci-labels --write`; regenerate rather
# than edit, so actionlint checks runs-on against what really exists.
self-hosted-runner:
  labels:
    - builderbot
    - self-hosted
    - linux
    - x64
    - unraid
    - bb-sandbox
