# BuilderBot OS (R160 step 1): GRUB's menu on the ESP, the same file under
# UEFI and BIOS. Two root slots, A and B, each a squashfs on its own
# partition with its kernel and initrd under /builderbot/SLOT on the ESP;
# bb_slot in grubenv (the slot tool's "next") names the one to boot, and the
# other is the entry under it. Counting a new slot's tries, marking it good
# and Safe mode are R161 step 2's, on this file.
set timeout=3
search --no-floppy --fs-uuid --set=root BB00-B007
if [ -s $prefix/grubenv ]; then
    load_env
fi
if [ -z "$bb_slot" ]; then
    set bb_slot=a
fi
set default="slot-${bb_slot}"
# The USB edition (R161 step 1): with bb_toram=1 in grubenv (the stick
# maker sets it) the slot is loaded into memory by the initramfs and the
# root is the copy, /dev/loop0; an installed disk boots the slot in place.
set root_a="root=PARTUUID=6a5c2f3e-0b7d-4b2a-9c1e-b0b1de5b0e0a"
set root_b="root=PARTUUID=6a5c2f3e-0b7d-4b2a-9c1e-b0b1de5b0e0b"
set ram=""
if [ "$bb_toram" = 1 ]; then
    set root_a="root=/dev/loop0 bbslotdev=PARTUUID=6a5c2f3e-0b7d-4b2a-9c1e-b0b1de5b0e0a bbtoram=1"
    set root_b="root=/dev/loop0 bbslotdev=PARTUUID=6a5c2f3e-0b7d-4b2a-9c1e-b0b1de5b0e0b bbtoram=1"
    set ram=" (in memory)"
fi
menuentry "BuilderBot OS, slot A$ram" --id slot-a {
    linux /builderbot/a/vmlinuz $root_a rootfstype=squashfs ro overlayroot=tmpfs bbslot=a quiet systemd.show_status=auto
    initrd /builderbot/a/initrd
}
menuentry "BuilderBot OS, slot B$ram" --id slot-b {
    linux /builderbot/b/vmlinuz $root_b rootfstype=squashfs ro overlayroot=tmpfs bbslot=b quiet systemd.show_status=auto
    initrd /builderbot/b/initrd
}
