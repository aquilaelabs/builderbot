# BuilderBot OS (R160 step 1, R161 step 2): GRUB's menu on the ESP, the same
# file under UEFI and BIOS. Two root slots, A and B, each a squashfs on its
# own partition with its kernel and initrd under /builderbot/SLOT on the
# ESP; bb_slot in grubenv (the slot tool's "next") names the one to boot,
# and the other is the entry under it. A slot written by an update boots on
# trial (bb_trial=1, bb_prev the slot before): each boot counts bb_tries
# here, the health check marks the slot good (slot good) once the dashboard
# and the agent are up, and a third boot without that goes back to bb_prev.
# Safe mode boots the slot with nothing but the dashboard and the shares
# (bbsafe=1, which the held start reads).
set timeout=4
# The menu on a serial line as well as the screen, so a machine with no
# screen (a VM, a NAS's serial header, the CI boot test) shows it too.
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
search --no-floppy --fs-uuid --set=root BB00-B007
if [ -s $prefix/grubenv ]; then
    load_env
fi
if [ -z "$bb_slot" ]; then
    set bb_slot=a
fi
if [ "$bb_trial" = 1 ]; then
    if [ "$bb_tries" = 2 ]; then
        # Two boots without the health check's word: back to the slot before.
        set bb_slot="$bb_prev"
        set bb_trial=0
        set bb_tries=0
        set bb_fell_back=1
    elif [ "$bb_tries" = 1 ]; then
        set bb_tries=2
    else
        set bb_tries=1
    fi
    save_env bb_slot bb_trial bb_tries bb_fell_back
fi
set default="slot-${bb_slot}"
# bb_args in grubenv goes on the end of every entry's kernel line: a kernel
# argument a machine needs, or the console moved to the serial line (the
# last console= is the one the initramfs and systemd write to), which the
# CI boot test sets so a failing boot's own words reach its log.
# The USB edition (R161 step 1): with bb_toram=1 in grubenv (the stick
# maker sets it) the slot is loaded into memory by the initramfs and the
# root is the copy, /dev/loop0; an installed disk boots the slot in place.
set root_a="root=PARTUUID=6a5c2f3e-0b7d-4b2a-9c1e-b0b1de5b0e0a"
set root_b="root=PARTUUID=6a5c2f3e-0b7d-4b2a-9c1e-b0b1de5b0e0b"
set ram=""
if [ "$bb_toram" = 1 ]; then
    set root_a="root=/dev/loop0 bbslotdev=PARTUUID=6a5c2f3e-0b7d-4b2a-9c1e-b0b1de5b0e0a bbtoram=1"
    set root_b="root=/dev/loop0 bbslotdev=PARTUUID=6a5c2f3e-0b7d-4b2a-9c1e-b0b1de5b0e0b bbtoram=1"
    set ram=" (in memory)"
fi
if [ -n "$bb_ver_a" ]; then set name_a="BuilderBot OS $bb_ver_a, slot A"; else set name_a="BuilderBot OS, slot A"; fi
if [ -n "$bb_ver_b" ]; then set name_b="BuilderBot OS $bb_ver_b, slot B"; else set name_b="BuilderBot OS, slot B"; fi
menuentry "$name_a$ram" --id slot-a {
    linux /builderbot/a/vmlinuz $root_a rootfstype=squashfs ro overlayroot=tmpfs bbslot=a console=ttyS0,115200 console=tty0 quiet systemd.show_status=auto $bb_args
    initrd /builderbot/a/initrd
}
menuentry "$name_b$ram" --id slot-b {
    linux /builderbot/b/vmlinuz $root_b rootfstype=squashfs ro overlayroot=tmpfs bbslot=b console=ttyS0,115200 console=tty0 quiet systemd.show_status=auto $bb_args
    initrd /builderbot/b/initrd
}
if [ "$bb_slot" = b ]; then set safe_root="$root_b"; set safe_slot=b; else set safe_root="$root_a"; set safe_slot=a; fi
menuentry "Safe mode: the dashboard and the shares, nothing else started" --id safe {
    linux /builderbot/$safe_slot/vmlinuz $safe_root rootfstype=squashfs ro overlayroot=tmpfs bbslot=$safe_slot bbsafe=1 console=ttyS0,115200 console=tty0 systemd.show_status=auto $bb_args
    initrd /builderbot/$safe_slot/initrd
}
