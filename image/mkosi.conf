# The appliance image (R160 step 1): Debian stable, built by mkosi into one
# root tree that image/build.sh then seals as a read-only squashfs and lays
# into a disk with two root slots. What is built FROM is pinned: the Debian
# snapshot in image/SNAPSHOT (build.sh hands it to mkosi as the mirror), the
# packages below, and the controller's own list, config/controller-packages.tsv,
# which build.sh turns into a second packages file beside this one, so the
# container image, a bare-metal install and this image read one list.
#
# Nothing here is a disk: the tree is the product of this file, and the slots,
# GRUB and the data partition are build.sh's, written down in docs/image.md.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,contrib,non-free-firmware

[Output]
Format=directory
ImageId=builderbot-os
Output=tree
CompressOutput=no

[Build]
# The checkout's noVNC pin is fetched by --stage, by its checksum.
WithNetwork=yes
# The checkout, for mkosi.postinst: the controller is staged from it with
# nodes/install-controller.sh --stage, as a bare-metal install lays it out.
BuildSources=..:builderbot

[Content]
Bootable=no
Hostname=builderbot
Locale=C.UTF-8
Timezone=UTC
WithRecommends=no
WithDocs=no
CleanPackageMetadata=yes
Packages=
        # The kernel and what boots it: GRUB for UEFI and BIOS alike (a NAS
        # board may be either), initramfs-tools with overlayroot for the
        # read-only root, and the firmware a NAS's network and storage
        # controllers load.
        linux-image-amd64
        linux-headers-amd64
        firmware-linux
        initramfs-tools
        overlayroot
        # The ISO boots the same root live (R160 step 2): live-boot finds it
        # on the medium, and the installer asks with whiptail.
        live-boot
        live-boot-initramfs-tools
        whiptail
        grub-efi-amd64-bin
        grub-pc-bin
        grub-common
        # The system: systemd with its network, name and time services.
        systemd
        systemd-sysv
        systemd-resolved
        systemd-timesyncd
        udev
        dbus
        kmod
        sudo
        polkitd
        locales
        tzdata
        ca-certificates
        bash-completion
        less
        nano
        procps
        psmisc
        rsync
        unzip
        zstd
        iproute2
        iputils-ping
        ethtool
        pciutils
        usbutils
        lshw
        dmidecode
        lm-sensors
        # Disks: SMART, NVMe, partitioning, every filesystem a pool or an
        # array uses (R162), and ZFS built here against this very kernel,
        # so the two never part (the operator, 22 Oct).
        smartmontools
        hdparm
        nvme-cli
        parted
        gdisk
        dosfstools
        e2fsprogs
        xfsprogs
        btrfs-progs
        dkms
        build-essential
        zfs-dkms
        zfsutils-linux
        mergerfs
        snapraid
        # Shares (R164).
        samba
        nfs-kernel-server
        nfs-common
        # The node this machine is of itself: what provision-linux.sh's deb
        # family installs (base, python, pycrypto, session, reel, wg, nft),
        # with Debian's own docker in place of Docker's repository, since a
        # pinned snapshot has to carry everything the image is made of.
        python3
        python3-cryptography
        tmux
        jq
        git
        git-lfs
        curl
        wget
        gnupg
        openssh-client
        xvfb
        xdotool
        x11-utils
        wireguard-tools
        nftables
        docker.io
        docker-compose
        containerd
        # The VM host feature (R91, R165): what vmhost_pkgs lists for deb.
        qemu-system-x86
        qemu-utils
        libvirt-daemon-system
        libvirt-clients
        cloud-image-utils
        ovmf
        virtiofsd
        # What an update needs inside the image (R160 step 4): gh, which
        # verifies a release's build attestation, the squashfs tools, and
        # the GRUB tools the slot tool marks the next boot with.
        gh
        squashfs-tools
