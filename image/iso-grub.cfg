# The ISO's menu (R160 step 2): the same kernel, initrd and root squashfs the
# disk carries, booted live (live-boot finds live/filesystem.squashfs on the
# medium) with the installer on the console.
set timeout=5
set default=0
menuentry "Install BuilderBot OS" {
    linux /live/vmlinuz boot=live components bbinstaller=1 quiet systemd.show_status=auto
    initrd /live/initrd
}
menuentry "Boot BuilderBot OS from this medium without installing" {
    linux /live/vmlinuz boot=live components quiet systemd.show_status=auto
    initrd /live/initrd
}
