# The lab's Gitea (roadmap R54): a real forge for the suites the harness
# cannot prove against stand-ins. One container, plain http on :3000 and
# ssh on :2222, seeded on first start with an administrator the lab suites
# sign in as to mint their own tokens. Nothing here is a secret: it is a
# server on a LAN that exists to be tested against, and its data volume
# can be thrown away at any time.
#
#   bb lab up        bring it up (on a machine whose docker you can reach)
#   bb lab status    say whether it answers and print the environment
#   bb tests lab     run the lab suites against it
#   bb lab down      stop it; `docker volume rm lab_gitea` forgets it
#
# Actions are enabled so the runner half (act_runner) can be proved against
# it too. BB_LAB_HOST is the address other machines reach this one on; the
# default is right when the suite runs on the same machine.
services:
  gitea:
    image: docker.gitea.com/gitea:1.24
    container_name: bb-lab-gitea
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: "http://${BB_LAB_HOST:-127.0.0.1}:3000/"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_DOMAIN: "${BB_LAB_HOST:-127.0.0.1}"
      GITEA__server__SSH_PORT: "2222"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__actions__ENABLED: "true"
      GITEA__log__LEVEL: "Warn"
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - gitea:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
  # One-shot: the administrator the lab suites sign in as. Idempotent, so a
  # second `up` is not an error.
  seed:
    image: docker.gitea.com/gitea:1.24
    depends_on:
      gitea:
        condition: service_healthy
    user: "1000:1000"
    environment:
      GITEA_WORK_DIR: /data/gitea
      GITEA_CUSTOM: /data/gitea
      HOME: /data/git
    volumes:
      - gitea:/data
    entrypoint:
      - /bin/sh
      - -c
      - >
        gitea --config /data/gitea/conf/app.ini admin user create
        --admin --username labadmin --password labpassword
        --email lab@example.invalid --must-change-password=false
        2>&1 | grep -v 'already exists' || true;
        echo 'lab seeded: labadmin/labpassword'
volumes:
  gitea:
