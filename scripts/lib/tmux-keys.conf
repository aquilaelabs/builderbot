# The keys the dashboard's terminal relies on, given to every tmux server a
# terminal runs under: bb-tty sources this file before each attach. Not a
# setting, so not in tmux.conf: nothing here is the operator's to override.
#
# The key the terminal sends before what is typed into a pane it scrolled
# back: copy mode left if the pane is in it, and nothing otherwise, the key
# itself never reaching the program. In the same stream as what follows, so
# nothing typed lands in copy mode (B254). A sequence no keyboard sends, as
# tmux's first user key (page-term.js TERM_LEAVE).
#
# Keys that come faster than assume-paste-time are taken for a paste, and a
# paste runs no binding: a drag's lines in one frame went to the program as
# text. The page's keys are bindings by design, so nothing is taken for a
# paste; the bindings outside copy mode are these, PgUp's and the mouse's.
set -g assume-paste-time 0
set -s user-keys[0] "\e[9001~"
bind -n User0 if-shell -F '#{pane_in_mode}' 'send-keys -X cancel'
bind -T copy-mode User0 send-keys -X cancel
bind -T copy-mode-vi User0 send-keys -X cancel

# A line of history up and a line down, as a finger's drag and the keys
# bar's PgUp and PgDn scroll (page-term.js termScroll): up enters copy mode
# where the pane is not in it, and copy mode ends by itself at the bottom
# (-e). Sent in the terminal's own stream, so they reach whichever tmux
# server it runs under, a container's or a VM console's included.
set -s user-keys[1] "\e[9002~"
set -s user-keys[2] "\e[9003~"
bind -n User1 copy-mode -e \; send-keys -X scroll-up
bind -T copy-mode User1 send-keys -X scroll-up
bind -T copy-mode-vi User1 send-keys -X scroll-up
bind -n User2 if-shell -F '#{pane_in_mode}' 'send-keys -X scroll-down'
bind -T copy-mode User2 send-keys -X scroll-down
bind -T copy-mode-vi User2 send-keys -X scroll-down

# A key copy mode has no use for leaves it, so a letter typed into a pane
# scrolled back ends the scroll rather than vanishing (the operator, 23 Oct:
# Codex's approval list ignored every key while the pane sat in copy mode a
# scroll had put it in). Its own keys (arrows, q, /) keep their meaning.
bind -T copy-mode Any send-keys -X cancel
bind -T copy-mode-vi Any send-keys -X cancel

# tmux's own right-click menu is drawn in the terminal, underneath the
# browser's context menu, which covers it: two menus for one click, and only
# one of them dismissable. The browser's is the one with copy and paste.
unbind -n MouseDown3Pane
unbind -n MouseDown3Status
unbind -n MouseDown3StatusLeft
unbind -n MouseDown3StatusRight
