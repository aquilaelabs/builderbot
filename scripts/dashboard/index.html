<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>BuilderBot</title>
<!-- Inline so the browser never asks the server for /favicon.ico — the only
     404 this page would otherwise produce. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b2027'/%3E%3Cpath d='M9 21l5-10 5 10M11 18h6' stroke='%233fb950' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='23.5' cy='11.5' r='2.5' fill='%233fb950'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#14181d; --panel:#1b2027; --line:#2a323c; --ink:#e6edf3;
  --dim:#8b98a5; --accent:#3fb950; --warn:#d29922; --bad:#f85149;
  --note:#58a6ff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --tap:38px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);display:flex;
  flex-direction:column;overflow:hidden;
  font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left)}

header{display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
header h1{font-size:15px;margin:0;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.spacer{flex:1}
.meta{color:var(--dim);font:12px/1.4 var(--mono);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
@media(max-width:600px){ .meta.host{display:none} }

.switch{display:none;gap:6px;padding:6px 12px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:0 0 auto}
.switch button{flex:1;min-height:var(--tap)}

main{flex:1;min-height:0;display:grid;grid-template-columns:340px 1fr;
  gap:10px;padding:10px}
.col{display:flex;flex-direction:column;gap:10px;min-height:0}
.col.side{overflow:auto;-webkit-overflow-scrolling:touch}
@media(max-width:900px){
  .switch{display:flex}
  main{grid-template-columns:1fr;padding:8px;gap:8px}
  body[data-view="terminal"] .col.side{display:none}
  body[data-view="dash"] .col.term{display:none}
}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;flex:0 0 auto}
.card h2{margin:0;padding:8px 12px;font-size:11px;text-transform:uppercase;
  letter-spacing:.6px;color:var(--dim);border-bottom:1px solid var(--line);
  font-weight:600;display:flex;align-items:center;gap:8px;min-height:33px}
.card h2 span{margin-left:auto}
.card h2 button{font-size:10px;letter-spacing:.4px;text-transform:uppercase;
  min-height:22px;padding:3px 8px}
@media(max-width:900px){ .card h2 button{min-height:var(--tap)} }
.row{display:flex;align-items:center;gap:8px;padding:7px 10px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .name{font-weight:600}
.row .sub{color:var(--dim);font:12px/1.4 var(--mono)}
.row .sub.bad{color:var(--bad)}
.row .sub.warn{color:var(--warn)}
/* Excluded is a decision, not a fault — stated plainly rather than alarming. */
.row .sub.off{color:var(--dim);font-style:italic}
.grow{flex:1;min-width:120px}

button{background:#232b34;color:var(--ink);border:1px solid var(--line);
  border-radius:6px;padding:6px 10px;font:12px/1 inherit;cursor:pointer;
  white-space:nowrap;min-height:30px;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent}
button:hover{background:#2b3540}
button:disabled{opacity:.5;cursor:default}
button:disabled:hover{background:#232b34}
button.primary{background:#1f6f36;border-color:#2ea043}
button.on{background:#1f6f36;border-color:#2ea043}
.macros{display:flex;flex-wrap:wrap;gap:6px;padding:9px 10px}
@media(max-width:900px){ .row button,.macros button{min-height:var(--tap)} }

.pill{font:11px/1 var(--mono);padding:3px 7px;border-radius:99px;
  border:1px solid var(--line);color:var(--dim)}
.pill.ok{color:var(--accent);border-color:#22452c}
.pill.bad{color:var(--bad);border-color:#4d2220}
.pill.warn{color:var(--warn);border-color:#4a3a15}
.pill.note{color:var(--note);border-color:#1f3c5d}
/* A job can run for many minutes; a still badge reads as a stale page. */
.spin{width:11px;height:11px;border-radius:50%;flex:0 0 auto;
  border:2px solid #1f3c5d;border-top-color:var(--note);
  animation:spin 900ms linear infinite}
.spin.bad{border-color:#4d2220;border-top-color:var(--bad)}
.row code{font:11px/1.5 var(--mono);background:#232b34;padding:1px 5px;
  border-radius:4px;white-space:nowrap}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){ .spin{animation:none} }

pre{margin:0;padding:9px 11px;font:12px/1.45 var(--mono);white-space:pre-wrap;
  word-break:break-word;max-height:300px;overflow:auto;color:#cbd5e1}
.empty{color:var(--dim);padding:9px 11px;font-style:italic}

/* Tabs --------------------------------------------------------------- */
.col.term{min-height:0}
.tabbar{display:flex;gap:5px;flex-wrap:wrap;padding:6px 7px;background:var(--panel);
  border:1px solid var(--line);border-radius:8px 8px 0 0;flex:0 0 auto;
  align-items:center;position:relative}
.tab{display:flex;align-items:center;gap:0;border:1px solid var(--line);
  border-radius:6px;overflow:hidden;background:#232b34}
.tab.on{background:#1f6f36;border-color:#2ea043}
.tab button{border:0;border-radius:0;background:transparent;min-height:28px}
.tab .lbl{padding:6px 8px;max-width:34vw;overflow:hidden;text-overflow:ellipsis;
  cursor:grab;touch-action:none;user-select:none}
.tab.held{opacity:.45}
body.dragging{cursor:grabbing;user-select:none}
body.dragging .tab .lbl{cursor:grabbing}
.tab .ic{padding:6px 7px;color:var(--dim);font-size:13px;line-height:1}
.tab .ic:hover{background:rgba(255,255,255,.09);color:var(--ink)}
@media(max-width:900px){ .tab button{min-height:var(--tap)} }
.tabbar .sep{flex:1}

.pinmenu{position:absolute;z-index:20;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:5px;display:flex;
  gap:5px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.pinmenu button{min-height:var(--tap)}

/* Panes -------------------------------------------------------------- */
.panes{flex:1;min-height:0;display:grid;gap:6px;grid-template-columns:1fr;
  background:var(--line);border:1px solid var(--line);border-top:0;
  border-radius:0 0 8px 8px;overflow:hidden}
.panes.split{grid-template-columns:1fr 1fr}
@media(max-width:900px){ .panes.split{grid-template-columns:1fr} }
.pane{position:relative;background:#000;min-height:0;display:flex;flex-direction:column}
.pane.hidden{display:none}
.pane.active{outline:2px solid #2ea043;outline-offset:-2px}
.pane .bar{display:flex;align-items:center;gap:6px;padding:3px 6px;
  background:rgba(20,24,29,.92);border-bottom:1px solid var(--line);
  font:11px/1.6 var(--mono);color:var(--dim);flex:0 0 auto}
.pane .bar .x{margin-left:auto;cursor:pointer;padding:2px 7px;border-radius:4px}
.pane .bar .x:hover{background:rgba(255,255,255,.1);color:var(--ink)}
.pane .bar button{min-height:22px;padding:2px 8px;font-size:11px}
.pane iframe{flex:1;border:0;width:100%;display:block}
.pane .doc{flex:1;overflow:auto;background:var(--bg);padding:12px;
  -webkit-overflow-scrolling:touch}
.pane .slot{flex:1;min-height:0;display:flex}
.pane .empty-pane{margin:auto;color:var(--dim);font-style:italic}

/* Keys --------------------------------------------------------------- */
.keys{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);
  border-top:0;border-radius:0 0 8px 8px;padding:6px;display:none;gap:5px;flex-wrap:wrap}
.keys.show{display:flex}
.keys button{font-family:var(--mono);min-width:40px;min-height:var(--tap);padding:6px 8px}
.keys .gap{flex-basis:100%;height:0}

/* Findings view ------------------------------------------------------ */
.fx h3{margin:0 0 8px;font-size:15px}
.fx .stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fx .grp{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;
  background:var(--panel);overflow:hidden}
.fx .grp>summary{padding:9px 11px;cursor:pointer;font-weight:600;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;list-style:none}
.fx .grp>summary::-webkit-details-marker{display:none}
.fx .grp>summary::before{content:"▸";color:var(--dim);font-size:11px}
.fx .grp[open]>summary::before{content:"▾"}
.fx .bust{padding:9px 11px;color:var(--bad);font-weight:600}
.fx .rule{border-top:1px solid var(--line);padding:9px 11px}
.fx .rule .rid{font:12px/1.5 var(--mono);color:var(--dim);word-break:break-all}
.fx .rule .desc{margin:3px 0 6px}
.fx .loc{font:12px/1.7 var(--mono);color:#cbd5e1}
.fx .msg{font:12px/1.5 var(--mono);color:var(--dim);white-space:pre-wrap;
  margin:5px 0 0;padding-left:9px;border-left:2px solid var(--line)}
.fx a{color:var(--note)}
.fx .cve{display:inline-block;font:11px/1 var(--mono);padding:3px 7px;
  border-radius:99px;border:1px solid #4d2220;color:var(--bad);
  text-decoration:none;margin:0 4px 4px 0}
.fx .cve:hover{background:#2a1a1a}
</style>
</head>
<body data-view="dash">
<header>
  <span class="dot" id="dot"></span>
  <h1>BuilderBot</h1>
  <span class="meta host" id="host"></span>
  <span class="spacer"></span>
  <span class="meta" id="uptime"></span>
  <button onclick="refresh()">↻</button>
</header>

<div class="switch">
  <button id="vDash" class="on" onclick="setView('dash')">Dashboard</button>
  <button id="vTerm" onclick="setView('terminal')">Terminal</button>
</div>

<main>
  <div class="col side">
    <div class="card">
      <h2>Runner</h2>
      <div id="runner"><div class="empty">loading…</div></div>
    </div>
    <div class="card">
      <h2>Projects<span id="projTog"></span></h2>
      <div id="projects"><div class="empty">loading…</div></div>
    </div>
    <div class="card" id="cardFindings" hidden>
      <h2>Static analysis</h2>
      <div class="macros">
        <button class="primary" onclick="openFindings()">Open findings report</button>
      </div>
    </div>
    <div class="card">
      <h2>Sessions</h2>
      <div id="sessions"><div class="empty">loading…</div></div>
    </div>
    <div class="card">
      <h2>Commands</h2>
      <div class="macros">
        <button onclick="macro('doctor')">doctor</button>
        <button onclick="macro('status')">status</button>
        <button onclick="macro('logs')">logs</button>
        <button onclick="macro('emu-list')">emu list</button>
        <button onclick="macro('emu-start')">emu start</button>
        <button onclick="macro('emu-stop')">emu stop</button>
        <button onclick="macro('update')">update claude</button>
      </div>
    </div>
    <div class="card">
      <h2>Output</h2>
      <pre id="out">Pick a command.</pre>
    </div>
  </div>

  <div class="col term">
    <div class="tabbar" id="tabbar"></div>
    <div class="panes" id="panes">
      <div class="pane active" id="pane0"></div>
      <div class="pane hidden" id="pane1"></div>
    </div>
    <div class="keys" id="keys"></div>
  </div>
</main>

<script>
"use strict";

// ---- state -----------------------------------------------------------
// One permanent workspace tab; everything else is opened and closable. Tabs
// are separate from panes on purpose: a pane is a viewport, and closing one
// should not destroy what it was showing.
let tabs = [{id:"ws", kind:"term", arg:"shell", label:"workspace", fixed:true}];
let panes = ["ws", null];
let active = 0;
let state = null;
let findings = null;
let pinFor = null;
let showKeys = window.matchMedia("(pointer: coarse)").matches;
let seq = 0;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tabOf = id => tabs.find(t => t.id === id) || null;
const isSplit = () => panes[1] !== null;

// Mirrors bb-tty. The key bar and the kill button both address tmux by name,
// and the terminal is an iframe we cannot reach into, so they must agree.
const sessionOf = arg =>
  arg.startsWith("claude:") ? "claude-" + arg.slice(7) :
  arg.startsWith("shell:")  ? "shell-"  + arg.slice(6) : arg;

const ttydUrl = arg =>
  `${location.protocol}//${location.hostname}:${state.ttyd_port}/?arg=${encodeURIComponent(arg)}`;

const isPhone = () => window.matchMedia("(max-width:900px)").matches;

const dur = s =>
  s < 60   ? `${s}s` :
  s < 3600 ? `${Math.floor(s/60)}m ${s%60}s` :
             `${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`;

function setView(v){
  document.body.dataset.view = v;
  $("vDash").classList.toggle("on", v === "dash");
  $("vTerm").classList.toggle("on", v === "terminal");
}

// ---- tabs ------------------------------------------------------------
// What makes two tabs the same tab. For a terminal it is the tmux session,
// NOT the argument that produced it: "claude:FreshBoot" from the project list
// and "claude-FreshBoot" from the session list are different strings naming
// one session, and letting both exist puts two ✕ buttons on it.
const identity = t => t.kind === "term" ? "tmux:" + sessionOf(t.arg)
                                        : t.kind + ":" + t.arg;

// One tab per thing. A second click on Claude/Shell/Findings for something
// already open is a request to go to it, not to open a duplicate.
function openTab(spec){
  let t = tabs.find(x => identity(x) === identity(spec));
  if (!t){ t = Object.assign({id:"t" + (++seq)}, spec); tabs.push(t); }

  const shown = panes.indexOf(t.id);
  if (shown === -1) panes[active] = t.id;    // not on screen — put it here
  else active = shown;                       // already on screen — focus it
  show(t);
}

function focusTab(id){
  const t = tabOf(id);
  if (!t) return;
  const shown = panes.indexOf(id);
  if (shown === -1) panes[active] = id; else active = shown;
  show(t);
}

// Common tail of "make this tab the one being looked at".
function show(t){
  pinFor = null;
  render();
  if (isPhone()) setView("terminal");
  if (t.kind === "findings" && !findings) loadFindings();
}

async function closeTab(id, ev){
  ev?.stopPropagation();
  const t = tabOf(id);
  if (!t || t.fixed) return;

  // A terminal tab owns a tmux session; closing the tab ends it, or detached
  // sessions pile up invisibly behind a UI that looks tidy. Claude gets a
  // confirm because ending one throws away a conversation in progress.
  if (t.kind === "term"){
    // Ask about the resolved tmux session, not the argument. A tab opened from
    // the Sessions list carries the raw name ("claude-Foo"), and testing the
    // argument closed a live conversation without asking.
    const session = sessionOf(t.arg);
    if (session.startsWith("claude-") &&
        !confirm(`End the Claude session in ${session.slice(7)}?\n\nThe transcript is kept, but the conversation stops.`))
      return;
    try{
      await fetch("/api/session", {method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({action:"kill", session})});
    }catch(e){ /* already gone is fine */ }
  }

  tabs = tabs.filter(x => x.id !== id);
  for (let i = 0; i < 2; i++) if (panes[i] === id) panes[i] = null;
  if (panes[0] === null && panes[1] !== null){ panes[0] = panes[1]; panes[1] = null; }
  if (panes[0] === null) panes[0] = "ws";
  if (panes[1] === null) active = 0;
  render(); refresh();
}

function pinTo(id, idx, ev){
  ev?.stopPropagation();
  pinFor = null;
  const other = 1 - idx;
  if (panes[other] === id){
    // It is already in the other pane. That pane needs something else or the
    // tab renders twice — two iframes attaching to one tmux session.
    const fill = tabs.find(t => t.id !== id)?.id ?? null;
    if (idx === 1 && fill === null){ render(); return; }  // nothing to sit beside it
    panes[other] = idx === 1 ? fill : null;
  }
  panes[idx] = id;
  active = idx;
  render();
}

// Closing a pane collapses the layout. It must not close the tab — the tab is
// the thing that owns a session, the pane is only where it was being shown.
function closePane(idx, ev){
  ev?.stopPropagation();
  if (idx === 1){ panes[1] = null; active = 0; }
  else { panes[0] = panes[1] ?? "ws"; panes[1] = null; active = 0; }
  render();
}

function togglePin(id, ev){
  ev.stopPropagation();
  pinFor = pinFor === id ? null : id;
  drawTabs();
}

// Positioning happens in drawTabs, not here, because the tab bar is rebuilt on
// every status poll: anything measured at click time is gone 15 seconds later.
function placePinMenu(){
  const menu = $("pinmenu"), anchor = $("tabbar").querySelector(`.tab[data-id="${pinFor}"]`);
  if (!menu || !anchor) return;
  const a = anchor.getBoundingClientRect(), bar = $("tabbar").getBoundingClientRect();
  menu.style.left = Math.max(4, Math.min(a.left - bar.left,
                                         bar.width - menu.offsetWidth - 4)) + "px";
  menu.style.top = (a.bottom - bar.top + 4) + "px";
}

// ---- drag to reorder -------------------------------------------------
// Pointer events rather than HTML5 drag-and-drop, which does not exist on
// touch. Move/up are bound to the window because drawTabs replaces the very
// element the gesture started on.
let drag = null, swallowClick = false;

function startDrag(ev, id){
  if (ev.pointerType === "mouse" && ev.button !== 0) return;
  drag = {id, x0: ev.clientX, y0: ev.clientY, moved: false};
  window.addEventListener("pointermove", onDrag);
  window.addEventListener("pointerup", endDrag, {once: true});
  window.addEventListener("pointercancel", endDrag, {once: true});
}

// Where the dragged tab belongs: the number of *other* tabs that come before
// the pointer in reading order. That is exactly the insertion index once the
// dragged tab is spliced out, and it handles a wrapped tab bar for free.
function dropIndex(x, y, from){
  let idx = 0;
  [...$("tabbar").querySelectorAll(".tab")].forEach((el, i) => {
    if (i === from) return;
    const r = el.getBoundingClientRect();
    if (y > r.bottom || (y >= r.top && x > r.left + r.width / 2)) idx++;
  });
  return idx;
}

function onDrag(ev){
  if (!drag) return;
  if (!drag.moved){
    // A few pixels of slop, so an ordinary click is not read as a drag.
    if (Math.hypot(ev.clientX - drag.x0, ev.clientY - drag.y0) < 6) return;
    drag.moved = true; pinFor = null;
    document.body.classList.add("dragging");
  }
  ev.preventDefault();
  const from = tabs.findIndex(t => t.id === drag.id);
  if (from < 0) return;
  const to = dropIndex(ev.clientX, ev.clientY, from);
  if (to !== from){
    tabs.splice(to, 0, tabs.splice(from, 1)[0]);
    drawTabs();
  }
}

function endDrag(){
  window.removeEventListener("pointermove", onDrag);
  document.body.classList.remove("dragging");
  const moved = drag?.moved;
  drag = null;
  // Redraw ONLY after a real drag. `click` is dispatched after `pointerup`, so
  // rebuilding the tab bar here would replace the button mid-gesture and the
  // click would never reach a handler — every tab click silently doing nothing.
  if (!moved) return;
  swallowClick = true;                  // ...and the click ending a drag is not
  setTimeout(() => swallowClick = false, 0);   //    a request to switch tabs
  drawTabs();
}

function drawTabs(){
  const cur = panes[active];
  const html = tabs.map(t => {
    const where = panes[0] === t.id ? "◧" : panes[1] === t.id ? "◨" : "";
    const held = drag?.moved && drag.id === t.id ? " held" : "";
    return `<span class="tab ${t.id===cur?"on":""}${held}" data-id="${esc(t.id)}">
      <button class="lbl" data-show="${esc(t.id)}" title="drag to reorder">${esc(t.label)}${where?` <span style="opacity:.7">${where}</span>`:""}</button>
      <button class="ic" data-pin="${esc(t.id)}" title="pin to a pane">⇱</button>
      ${t.fixed?"":`<button class="ic" data-close="${esc(t.id)}" title="close tab">✕</button>`}
    </span>`;
  }).join("");

  $("tabbar").innerHTML = html +
    `<span class="sep"></span>` +
    `<button id="bKeys" class="${showKeys?"on":""}" title="on-screen keys">⌨</button>` +
    (pinFor ? `<span class="pinmenu" id="pinmenu">
        <button data-l="${esc(pinFor)}">◧ Left</button>
        <button data-r="${esc(pinFor)}">◨ Right</button>
      </span>` : "");

  const bar = $("tabbar");
  bar.querySelectorAll("[data-show]").forEach(b => {
    b.onpointerdown = e => startDrag(e, b.dataset.show);
    b.onclick = () => { if (!swallowClick) focusTab(b.dataset.show); };
  });
  bar.querySelectorAll("[data-pin]").forEach(b => b.onclick = e => togglePin(b.dataset.pin, e));
  bar.querySelectorAll("[data-close]").forEach(b => b.onclick = e => closeTab(b.dataset.close, e));
  bar.querySelectorAll("[data-l]").forEach(b => b.onclick = e => pinTo(b.dataset.l, 0, e));
  bar.querySelectorAll("[data-r]").forEach(b => b.onclick = e => pinTo(b.dataset.r, 1, e));
  $("bKeys").onclick = () => { showKeys = !showKeys; render(); };
  if (pinFor) placePinMenu();
}

// ---- panes -----------------------------------------------------------
// The pane's title bar is redrawn on every pass — it is cheap, and its close
// button only exists while the layout is split. The pane *body* is left alone
// whenever the same tab is still in it, because rebuilding it would reload the
// iframe and drop a live terminal for no reason.
function paintBar(pane, t, i){
  const closeBtn = isSplit()
    ? `<span class="x" data-cp="${i}" title="close this pane">✕</span>` : "";
  const reload = t.kind === "findings"
    ? `<button class="ic" data-reload="1" style="margin-left:8px">reload</button>` : "";
  const bar = pane.querySelector(".bar");
  bar.innerHTML = `<span>${esc(t.label)}</span>${reload}${closeBtn}`;
  bar.querySelectorAll("[data-cp]").forEach(b =>
    b.onclick = e => closePane(Number(b.dataset.cp), e));
  bar.querySelectorAll("[data-reload]").forEach(b =>
    b.onclick = e => { e.stopPropagation(); loadFindings(true); });
}

function drawPanes(){
  $("panes").classList.toggle("split", isSplit());
  for (let i = 0; i < 2; i++){
    const pane = $("pane" + i);
    pane.classList.toggle("hidden", i === 1 && !isSplit());
    pane.classList.toggle("active", isSplit() && i === active);
    if (i === 1 && !isSplit()) continue;

    const t = tabOf(panes[i]);
    const same = pane.dataset.tab === (t?.id || "") && pane.dataset.kind === (t?.kind || "");
    if (same && t){
      paintBar(pane, t, i);
      // Refill a document pane only when the report itself changed. Doing it
      // on every status poll would fight the reader for control of the page.
      if (t.kind === "findings" && pane.dataset.rev !== String(findingsRev)){
        pane.dataset.rev = String(findingsRev);
        renderFindingsInto(i);
      }
      continue;
    }
    if (same) continue;

    pane.dataset.tab = t?.id || ""; pane.dataset.kind = t?.kind || "";
    pane.onclick = () => { if (isSplit()){ active = i; render(); } };

    if (!t){ pane.innerHTML = `<div class="empty-pane">empty</div>`; continue; }
    pane.innerHTML = `<div class="bar"></div>` + (t.kind === "term"
      ? `<div class="slot"><iframe title="${esc(t.label)}" src="${esc(ttydUrl(t.arg))}"></iframe></div>`
      : `<div class="doc fx" id="doc${i}"></div>`);
    paintBar(pane, t, i);
    if (t.kind === "findings"){ pane.dataset.rev = String(findingsRev); renderFindingsInto(i); }
  }
}

// ---- keys ------------------------------------------------------------
const KEYS = [
  [["escape","Esc"],["tab","Tab"],["left","←"],["down","↓"],["up","↑"],["right","→"],
   ["home","Home"],["end","End"],["pgup","PgUp"],["pgdn","PgDn"]],
  [["ctrl-c","^C"],["ctrl-d","^D"],["ctrl-z","^Z"],["ctrl-l","^L"],["ctrl-r","^R"],
   ["ctrl-a","^A"],["ctrl-e","^E"],["ctrl-u","^U"],["ctrl-w","^W"],["enter","⏎"]],
  [["pipe","|"],["tilde","~"],["slash","/"],["backslash","\\"],["dash","-"],
   ["under","_"],["dollar","$"],["star","*"],["lt","<"],["gt",">"]],
];

function drawKeys(){
  const el = $("keys");
  const t = tabOf(panes[active]);
  const on = showKeys && t?.kind === "term";     // pointless over a document
  el.classList.toggle("show", on);
  if (!on){ el.innerHTML = ""; return; }
  el.innerHTML = KEYS.map(r =>
    r.map(([k,l]) => `<button data-k="${esc(k)}">${esc(l)}</button>`).join("")
  ).join('<span class="gap"></span>');
  el.querySelectorAll("[data-k]").forEach(b => b.onclick = () => sendKey(b.dataset.k));
}

async function sendKey(key){
  const t = tabOf(panes[active]);
  if (!t || t.kind !== "term") return;
  try{
    const r = await fetch("/api/keys", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({session: sessionOf(t.arg), key})});
    const j = await r.json();
    if (j.error) $("out").textContent = "key: " + j.error;
  }catch(e){ $("out").textContent = "key failed: " + e; }
}

// ---- findings --------------------------------------------------------
const LEVEL_ORDER = {error:0, warning:1, note:2, info:2, none:3};
const levelClass = l => l === "error" ? "bad" : l === "warning" ? "warn"
                      : (l === "note" || l === "info") ? "note" : "";

// Bumped only when the data actually changes. The status poll redraws every
// 15s, and re-rendering the report on each pass threw away whatever the reader
// had collapsed — and their scroll position with it.
let findingsRev = 0;

async function loadFindings(force){
  if (findings && !force) return;
  findings = {loading:true}; findingsRev++;
  drawPanes();
  try{
    const r = await fetch("/api/findings");
    findings = await r.json();
  }catch(e){ findings = {error:String(e)}; }
  findingsRev++;
  drawPanes();
}

// Which project sections the reader has collapsed, kept across re-renders so a
// reload of the report does not undo their triage.
const collapsed = new Set();

function renderFindingsInto(i){
  const el = $("doc" + i);
  if (!el) return;
  if (!findings || findings.loading){ el.innerHTML = `<div class="empty">loading…</div>`; return; }
  if (findings.error){ el.innerHTML = `<div class="empty">${esc(findings.error)}</div>`; return; }
  if (!findings.available){
    el.innerHTML = `<div class="empty">No /reports mount. Point the container's
      scanner-reports path at your scanner's output directory.</div>`; return;
  }

  const all = [];
  for (const rep of findings.reports)
    for (const f of rep.findings) all.push(Object.assign({tool: rep.tool}, f));
  const errs = findings.reports.filter(r => r.error);

  if (!all.length){
    el.innerHTML = `<h3>No findings</h3>
      <p class="empty">Reports parsed: ${findings.reports.map(r=>esc(r.file)).join(", ") || "none"}.
      Remember an absent project has not necessarily passed — SARIF records
      findings, not coverage.</p>` + errs.map(r =>
        `<div class="empty">${esc(r.file)}: ${esc(r.error)}</div>`).join("");
    return;
  }

  const by = (rows, k) => rows.reduce((m,x) => ((m[x[k] ?? "—"] ??= []).push(x), m), {});
  const counts = by(all, "level");
  const stat = Object.keys(counts).sort((a,b)=>(LEVEL_ORDER[a]??9)-(LEVEL_ORDER[b]??9))
    .map(l => `<span class="pill ${levelClass(l)}">${esc(l)} ${counts[l].length}</span>`).join("");

  const cveCount = new Set(all.flatMap(f => f.cves)).size;
  const projects = by(all, "project");

  // One report per tool is the common case, but a tool can write several and
  // an unparsed one has no name at all — so dedupe and drop the unknowns.
  const tools = [...new Set(findings.reports.map(r => r.tool).filter(t => t && t !== "?"))];

  let html = `<h3>Findings (${all.length})</h3><div class="stats">${stat}
    <span class="pill">${Object.keys(projects).length} projects</span>
    ${cveCount ? `<span class="pill bad">${cveCount} CVEs</span>` : ""}
    ${tools.length ? `<span class="pill">${esc(tools.join(" · "))}</span>` : ""}
  </div>`;

  html += errs.map(r =>
    `<div class="grp bust">${esc(r.file)} could not be parsed: ${esc(r.error)}</div>`
  ).join("");

  const projNames = Object.keys(projects).sort((a,b) => (a==="—")-(b==="—") || a.localeCompare(b));
  for (const proj of projNames){
    const rows = projects[proj];
    const lv = by(rows, "level");
    const badges = Object.keys(lv).sort((a,b)=>(LEVEL_ORDER[a]??9)-(LEVEL_ORDER[b]??9))
      .map(l => `<span class="pill ${levelClass(l)}">${esc(l)} ${lv[l].length}</span>`).join("");

    const shut = collapsed.has(proj) || proj === "—";
    html += `<details class="grp" data-proj="${esc(proj)}" ${shut?"":"open"}>
      <summary>${esc(proj === "—" ? "unattributed paths" : proj)} ${badges}</summary>`;

    const rules = by(rows, "rule");
    // Worst hit first, so a rule that fires at two levels is labelled by the
    // one that matters rather than by whichever the scanner happened to emit.
    for (const k of Object.keys(rules))
      rules[k].sort((a,b) => (LEVEL_ORDER[a.level]??9)-(LEVEL_ORDER[b.level]??9));
    const order = Object.keys(rules).sort((a,b) =>
      (LEVEL_ORDER[rules[a][0].level]??9)-(LEVEL_ORDER[rules[b][0].level]??9)
      || rules[b].length - rules[a].length);

    for (const rid of order){
      const hits = rules[rid];
      const f = hits[0];
      const cves = [...new Set(hits.flatMap(h => h.cves))];
      html += `<div class="rule">
        <div class="rid">
          <span class="pill ${levelClass(f.level)}">${esc(f.level)}</span>
          ${f.uri ? `<a href="${esc(f.uri)}" target="_blank" rel="noopener">${esc(rid)}</a>`
                  : esc(rid)} · ${hits.length}
        </div>
        <div class="desc">${esc(f.desc || "(no description)")}</div>
        ${cves.map(c => `<a class="cve" target="_blank" rel="noopener"
            href="https://nvd.nist.gov/vuln/detail/${esc(c)}">${esc(c)}</a>`).join("")}
        <div>${hits.map(h => `<div class="loc">${esc(h.path)}:${h.line}</div>`).join("")}</div>
        ${f.message && f.message !== f.desc
            ? `<div class="msg">${esc(f.message.slice(0, 600))}</div>` : ""}
      </div>`;
    }
    html += `</details>`;
  }
  el.innerHTML = html;
  el.querySelectorAll("details[data-proj]").forEach(d =>
    d.addEventListener("toggle", () =>
      d.open ? collapsed.delete(d.dataset.proj) : collapsed.add(d.dataset.proj)));
}

// ---- sidebar ---------------------------------------------------------
function drawRunner(r){
  const el = $("runner");
  if (!r.enabled){ el.innerHTML = '<div class="empty">disabled (ENABLE_RUNNER=false)</div>'; return; }
  // Order matters. A Listener process is up while a job runs *and* while the
  // runner is being refused by GitHub and retrying, so "listening" is the
  // weakest of the three claims and has to be checked last.
  const stuck = r.listening && r.connected === false;
  const cls = stuck  ? "bad"
            : r.busy ? "note"
            : r.listening ? "ok" : r.registered ? "warn" : "bad";
  const txt = stuck  ? "cannot connect — retrying"
            : r.busy ? (r.job ? `running job: ${r.job}` : "running a job")
            : r.listening ? "listening for jobs"
            : r.registered ? "registered, between jobs" : "not registered";
  el.innerHTML =
    `<div class="row"><span class="pill ${cls}">${esc(txt)}</span>` +
    ((r.busy || stuck) ? `<span class="spin${stuck?" bad":""}" title="${
        stuck ? "retrying the connection to GitHub" : "a job is executing in this container"
      }"></span>` : "") +
    (r.busy && !stuck && r.elapsed != null ? `<span class="sub">${esc(dur(r.elapsed))}</span>` : "") +
    `</div>` +
    (stuck ? `<div class="row"><span class="sub">${esc(r.detail || "")}</span></div>
      <div class="row"><span class="sub">Usually another process holding this
        runner's name. It clears when GitHub expires the old session; if it
        does not, check for a stray listener with
        <code>pgrep -af Runner.Listener</code>.</span></div>` : "") +
    (r.name ? `<div class="row"><span class="sub">${esc(r.name)} → ${esc(r.url||"")}</span></div>` : "") +
    // One toggle rather than a Restart that silently means stop-and-start.
    // Stopping waits for GitHub to release the session, so it is not instant —
    // the button says so instead of looking wedged.
    `<div class="macros">${
      [["runner-status", "Status", ""],
       r.running ? ["runner-stop", "Stop", ""]
                 : ["runner-start", "Start", "primary"]
      ].map(([m, label, cls]) =>
        `<button class="${cls}" data-m="${m}"${macroBusy ? " disabled" : ""}>${
          macroBusy === m ? "working…" : label}</button>`).join("")
    }</div>`;
  el.querySelectorAll("[data-m]").forEach(b => b.onclick = () => macro(b.dataset.m));
}

// Anything with a problem is hidden behind this, and stays reachable. The only
// thing never listed is an empty directory, which the server drops: it is not a
// problem to fix but a mount point waiting for content.
let showAllProjects = false;

function drawProjects(ps){
  const el = $("projects"), tog = $("projTog");
  const flagged = ps.filter(p => p.issues.length);
  const shown   = showAllProjects ? ps : ps.filter(p => !p.issues.length);

  tog.innerHTML = flagged.length
    ? `<button id="bAll">${showAllProjects ? "Hide" : "Show"} projects with errors (${flagged.length})</button>`
    : "";
  if (flagged.length)
    $("bAll").onclick = () => { showAllProjects = !showAllProjects; drawProjects(ps); };

  if (!shown.length){
    el.innerHTML = `<div class="empty">${
      !ps.length ? "nothing mounted under /workspace"
                 : `${flagged.length} ${flagged.length===1?"project needs":"projects need"} attention — use Show projects with errors`
    }</div>`;
    return;
  }

  const cls = {error:"bad", warning:"warn", excluded:"off"};
  el.innerHTML = shown.map(p => `
    <div class="row">
      <div class="grow">
        <div class="name">${esc(p.name)}</div>
        ${p.git ? `<div class="sub">git: ${esc(p.git)}</div>` : ""}
        ${p.issues.map(i =>
          `<div class="sub ${cls[i.level] || ""}">${esc(i.text)}</div>`).join("")}
      </div>
      ${p.excluded ? "" : `<button class="primary" data-c="${esc(p.name)}">Claude</button>`}
      <button data-s="${esc(p.name)}">Shell</button>
      <button data-x="${esc(p.name)}" data-on="${p.excluded ? "0" : "1"}"
        title="${p.excluded ? "allow Claude sessions here again"
                            : "block Claude sessions for this directory, and keep it blocked"}"
        >${p.excluded ? "Include" : "Exclude"}</button>
    </div>`).join("");
  el.querySelectorAll("[data-c]").forEach(b => b.onclick = () =>
    openTab({kind:"term", arg:`claude:${b.dataset.c}`, label:`claude ${b.dataset.c}`}));
  el.querySelectorAll("[data-s]").forEach(b => b.onclick = () =>
    openTab({kind:"term", arg:`shell:${b.dataset.s}`, label:`sh ${b.dataset.s}`}));
  el.querySelectorAll("[data-x]").forEach(b => b.onclick = () =>
    setExcluded(b.dataset.x, b.dataset.on === "1"));
}

async function setExcluded(name, on){
  if (on && !confirm(`Exclude ${name}?\n\nNo Claude session will be able to start `
        + `here, and any running one ends now. A shell is still available, and `
        + `Include reverses this.`)) return;
  try{
    const r = await fetch("/api/exclude", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({name, excluded:on})});
    const j = await r.json();
    if (j.error){ $("out").textContent = "exclude: " + j.error; return; }
    // The server ends a running session when excluding; drop its tab too, or
    // the page keeps offering a terminal onto something that is gone.
    if (j.killed){
      const t = tabs.find(x => x.kind === "term" && sessionOf(x.arg) === j.killed);
      if (t){
        tabs = tabs.filter(x => x.id !== t.id);
        for (let i = 0; i < 2; i++) if (panes[i] === t.id) panes[i] = null;
        if (panes[0] === null && panes[1] !== null){ panes[0] = panes[1]; panes[1] = null; }
        if (panes[0] === null) panes[0] = "ws";
        if (panes[1] === null) active = 0;
        render();
      }
    }
  }catch(e){ $("out").textContent = "exclude failed: " + e; }
  refresh();
}

// A session tmux knows as "claude-Foo" is the same thing the Projects card
// opens as "claude:Foo". Opening it under the raw name takes bb-tty's fallback
// branch — a bare shell at /workspace, skipping the project directory, the
// exclusion check and the scoped settings — which is only invisible while the
// session already exists. Map it back when the project is one we know.
function argForSession(name){
  const known = new Set((state?.projects || []).map(p => p.name));
  for (const [prefix, arg] of [["claude-", "claude:"], ["shell-", "shell:"]])
    if (name.startsWith(prefix) && known.has(name.slice(prefix.length)))
      return arg + name.slice(prefix.length);
  return name;
}

function drawSessions(ss){
  const el = $("sessions");
  if (!ss.length){ el.innerHTML = '<div class="empty">no tmux sessions — nothing is running</div>'; return; }
  el.innerHTML = ss.map(s => `
    <div class="row">
      <div class="grow"><span class="name">${esc(s.name)}</span>
        <span class="pill ${s.attached?"ok":""}">${s.attached?"attached":"detached"}</span></div>
      <button data-a="${esc(s.name)}">Open</button>
    </div>`).join("");
  el.querySelectorAll("[data-a]").forEach(b => b.onclick = () =>
    openTab({kind:"term", arg:argForSession(b.dataset.a), label:b.dataset.a}));
}

// Which macro is in flight, if any. Stopping the runner waits for a clean
// deregistration and can take a minute; a global rather than a per-button flag
// because the 15s poll redraws the card and would otherwise hand back a live
// button in the middle of the very operation it started.
let macroBusy = null;

async function macro(name, project){
  if (macroBusy){
    $("out").textContent = `still running ${macroBusy} — wait for it to finish.`;
    return;
  }
  macroBusy = name;
  $("out").textContent = `running ${name}…`;
  if (isPhone()) setView("dash");
  if (state) drawRunner(state.runner);
  try{
    const r = await fetch("/api/run", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({macro:name, project})});
    const j = await r.json();
    $("out").textContent = j.error ? "error: "+j.error
      : `$ ${j.cmd}\n\n${j.out || "(no output)"}${j.code?`\n\n[exit ${j.code}]`:""}`;
  }catch(e){ $("out").textContent = "request failed: "+e; }
  macroBusy = null;
  refresh();
}

function render(){ drawTabs(); drawPanes(); drawKeys(); }

async function refresh(){
  try{
    const r = await fetch("/api/status");
    if (!r.ok) throw new Error("HTTP " + r.status);
    state = await r.json();
    $("dot").style.background = "var(--accent)";
    $("host").textContent = state.host;
    $("uptime").textContent = "up " + state.uptime;
    drawRunner(state.runner);
    drawProjects(state.projects);
    drawSessions(state.sessions);
    $("cardFindings").hidden = !state.reports;
    render();
  }catch(e){ $("dot").style.background = "var(--bad)"; }
}

// Findings opens as a document tab, not a terminal — it is a report to read,
// and piping it through a PTY would only make it harder to.
function openFindings(){
  openTab({kind:"findings", arg:"__findings", label:"findings"});
}

document.addEventListener("click", e => {
  if (pinFor && !e.target.closest(".pinmenu") && !e.target.closest("[data-pin]")){
    pinFor = null; drawTabs();
  }
});

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
