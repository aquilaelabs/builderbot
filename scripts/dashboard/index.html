<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>BuilderBot</title>
<!-- Inline so the browser never asks the server for /favicon.ico — the only
     404 this page would otherwise produce. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b2027'/%3E%3Cg fill='%233fb950'%3E%3Crect x='4' y='8.5' width='24' height='17' rx='5.5'/%3E%3Crect x='15' y='3.5' width='2' height='6' rx='1'/%3E%3Ccircle cx='16' cy='3' r='2.3'/%3E%3C/g%3E%3Cg fill='%231b2027'%3E%3Ccircle cx='11.4' cy='15.4' r='2.1'/%3E%3Ccircle cx='20.6' cy='15.4' r='2.1'/%3E%3Crect x='10.6' y='19.6' width='10.8' height='2.6' rx='1.3'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --bg:#14181d; --panel:#1b2027; --line:#2a323c; --ink:#e6edf3;
  --dim:#8b98a5; --accent:#3fb950; --warn:#d29922; --bad:#f85149;
  --note:#58a6ff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --tap:38px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);display:flex;
  flex-direction:column;overflow:hidden;
  font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left)}

header{display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
header h1{font-size:15px;margin:0;font-weight:600}
.logo{width:22px;height:22px;flex:0 0 auto;color:var(--accent);display:block;
  transition:color .2s ease}
.logo.off{color:var(--bad)}
@media(prefers-reduced-motion:reduce){ .logo{transition:none} }
.spacer{flex:1}
.meta{color:var(--dim);font:12px/1.4 var(--mono);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
@media(max-width:600px){ .meta.host{display:none} }

.switch{display:none;gap:6px;padding:6px 12px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:0 0 auto}
.switch button{flex:1;min-height:var(--tap)}

main{flex:1;min-height:0;display:grid;grid-template-columns:340px 1fr;
  gap:10px;padding:10px}
.col{display:flex;flex-direction:column;gap:10px;min-height:0}
.col.side{overflow:auto;-webkit-overflow-scrolling:touch}
@media(max-width:900px){
  .switch{display:flex}
  main{grid-template-columns:1fr;padding:8px;gap:8px}
  body[data-view="terminal"] .col.side{display:none}
  body[data-view="dash"] .col.term{display:none}
}

/* position:relative so the resume chooser, which is absolutely positioned and
   measured against this box, actually lands inside it. */
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  flex:0 0 auto;position:relative}
.card h2{margin:0;padding:8px 12px;font-size:11px;text-transform:uppercase;
  letter-spacing:.6px;color:var(--dim);border-bottom:1px solid var(--line);
  font-weight:600;display:flex;align-items:center;gap:8px;min-height:33px}
.card h2 span{margin-left:auto}
.card h2 button{font-size:10px;letter-spacing:.4px;text-transform:uppercase;
  min-height:22px;padding:3px 8px}
@media(max-width:900px){ .card h2 button{min-height:var(--tap)} }
.row{display:flex;align-items:center;gap:8px;padding:7px 10px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .name{font-weight:600}
.row .sub{color:var(--dim);font:12px/1.4 var(--mono)}
.row .sub.bad{color:var(--bad)}
/* A problem the page can fix is a link in the colour of its own warning. */
.row .sub a.fix{color:inherit;text-decoration:underline;cursor:pointer}
.row .sub a.fix:hover{color:var(--ink)}
.row .sub.warn{color:var(--warn)}
/* Excluded is a decision, not a fault — stated plainly rather than alarming. */
.row .sub.off{color:var(--dim);font-style:italic}
/* An excluded project is greyed out because nothing acts on it. The two
   controls that still do — Shell, and the eye that lets it back in — keep their
   weight, or the row would look like it had been switched off entirely. */
.row.off .name,.row.off .sub{opacity:.55}
.row.off [data-s],.row.off .eye{opacity:1}
.grow{flex:1;min-width:120px}

button{background:#232b34;color:var(--ink);border:1px solid var(--line);
  border-radius:6px;padding:6px 10px;font:12px/1 inherit;cursor:pointer;
  white-space:nowrap;min-height:30px;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent}
button:hover{background:#2b3540}
button:disabled{opacity:.5;cursor:default}
button:disabled:hover{background:#232b34}
button.primary{background:#1f6f36;border-color:#2ea043}
button.on{background:#1f6f36;border-color:#2ea043}
.macros{display:flex;flex-wrap:wrap;gap:6px;padding:9px 10px}
/* A command and its thumbtack are one control with two halves, so the tack
   cannot be mistaken for a command of its own. */
.cmd{display:inline-flex;align-items:stretch;border:1px solid var(--line);
  border-radius:6px;overflow:hidden;background:#232b34}
.cmd button{border:0;border-radius:0;background:transparent;min-height:28px}
.cmd button:hover{background:#2b3540}
.cmd .tack{padding:4px 6px;color:#4b5563;border-left:1px solid var(--line);
  display:inline-flex;align-items:center}
.cmd .tack:hover{color:var(--ink)}
.cmd .tack.on{color:var(--accent)}
.cmd .tack svg{width:13px;height:13px;display:block;fill:none;stroke:currentColor;
  stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.cmd .tack.on svg{fill:currentColor}
@media(max-width:900px){ .cmd button{min-height:var(--tap)} }
/* A custom command's title is the operator's own words and can be any length;
   the card keeps its shape and the full text lives in the tooltip. */
.cmd .run{max-width:190px;overflow:hidden;text-overflow:ellipsis;display:block}

/* The editor. A dialog rather than a card of its own: it is a detour, and it
   should hand the page back when it is done. */
#modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  width:min(520px,100%);max-height:90vh;overflow:auto;
  box-shadow:0 18px 50px rgba(0,0,0,.6)}
#modal h3{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);
  font:600 13px/1.2 system-ui,sans-serif;letter-spacing:.3px;text-transform:uppercase}
#modal .field{padding:11px 14px}
#modal label{display:block;font:12px/1.5 system-ui,sans-serif;color:var(--dim);
  margin-bottom:5px}
#modal input,#modal textarea{width:100%;box-sizing:border-box;background:#161b22;
  color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 9px;
  font:13px/1.5 var(--mono)}
#modal textarea{min-height:132px;resize:vertical;white-space:pre}
#modal input:focus,#modal textarea:focus{outline:2px solid #2f4d6d;outline-offset:-1px}
#modal .hint{color:var(--dim);font:11px/1.5 system-ui,sans-serif;margin-top:6px}
#modal .foot{display:flex;gap:8px;padding:11px 14px;border-top:1px solid var(--line)}
#modal .foot .sp{flex:1}
#modal .danger{color:var(--bad);border-color:#4d2220}
/* Icon-width, so it sits beside Shell rather than wrapping the row. */
button.eye{padding:5px 7px;display:inline-flex;align-items:center;color:var(--dim)}
button.eye:hover{color:var(--ink)}
button.eye svg{width:16px;height:16px;display:block;fill:none;stroke:currentColor;
  stroke-width:1.4;stroke-linecap:round}
@media(max-width:900px){ .row button,.macros button{min-height:var(--tap)} }

/* What a Claude session is doing, at a glance. Blue matches the runner card's
   "busy" spinner — work in progress — and amber is the colour this page
   already uses for "wants a decision from you". Never green: a session
   waiting for input on an active (green) tab would vanish into it. */
.st{display:inline-block;width:8px;height:8px;border-radius:50%;flex:0 0 auto;
  margin-right:6px;vertical-align:baseline}
.st.working{background:var(--note);animation:pulse 1.6s ease-in-out infinite}
.st.waiting{background:var(--warn)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){ .st.working{animation:none} }

/* Doctor card: healthy checks collapse into green chips; anything wrong is a
   full-width line, because a failure is for reading and a pass is for
   counting. A healthy card folds down to just its header, so the verdict
   moves into a dot there — green, amber or red — where it survives the fold. */
#docDot{margin:0}   /* the h2's span rule would push it right, and its own
                       margin-right would double the flex gap */
.st.ok{background:var(--accent)}
.st.warn{background:var(--warn)}
.st.bad{background:var(--bad)}
.card.folded h2{border-bottom:0}   /* no body below it — a border there reads
                                      as a second card edge */
.doctor .probs{padding:7px 10px;display:flex;flex-direction:column;gap:4px}
.doctor .probs:empty{display:none}
.doctor .chips{display:flex;flex-wrap:wrap;gap:5px;padding:7px 10px;
  border-top:1px solid var(--line)}
.doctor .probs+.chips{border-top:1px solid var(--line)}
.doctor .probs:empty+.chips{border-top:0}
.doctor .chips .pill{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:100%}
#docTog{display:flex;align-items:center;gap:8px}
#docWhen{font:11px/1 var(--mono);color:var(--dim);text-transform:none;
  letter-spacing:0}

.pill{font:11px/1 var(--mono);padding:3px 7px;border-radius:99px;
  border:1px solid var(--line);color:var(--dim)}
.pill.ok{color:var(--accent);border-color:#22452c}
.pill.bad{color:var(--bad);border-color:#4d2220}
.pill.warn{color:var(--warn);border-color:#4a3a15}
.pill.note{color:var(--note);border-color:#1f3c5d}
/* A job can run for many minutes; a still badge reads as a stale page. */
.spin{width:11px;height:11px;border-radius:50%;flex:0 0 auto;
  border:2px solid #1f3c5d;border-top-color:var(--note);
  animation:spin 900ms linear infinite}
.spin.bad{border-color:#4d2220;border-top-color:var(--bad)}
.row code{font:11px/1.5 var(--mono);background:#232b34;padding:1px 5px;
  border-radius:4px;white-space:nowrap}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){ .spin{animation:none} }

pre{margin:0;padding:9px 11px;font:12px/1.45 var(--mono);white-space:pre-wrap;
  word-break:break-word;max-height:300px;overflow:auto;color:#cbd5e1}
.empty{color:var(--dim);padding:9px 11px;font-style:italic}

/* Macros run in the terminal now, so there is no output pane to put a message
   in. Anything the page needs to say is transient and says it here. */
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-140%);
  top:10px;z-index:60;max-width:min(560px,92vw);padding:9px 14px;border-radius:8px;
  background:#232b34;border:1px solid var(--line);color:var(--ink);
  font:13px/1.45 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.55);
  transition:transform .18s ease,opacity .18s ease;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.bad{border-color:#4d2220;color:var(--bad)}
@media(prefers-reduced-motion:reduce){ #toast{transition:none} }

.tabbar .newtab{border:1px solid var(--line);border-radius:6px;font-size:15px;
  line-height:1;padding:5px 9px;color:var(--dim)}
.tabbar .newtab:hover{color:var(--ink)}

/* Tabs --------------------------------------------------------------- */
.col.term{min-height:0}
.tabbar{display:flex;gap:5px;flex-wrap:wrap;padding:6px 7px;background:var(--panel);
  border:1px solid var(--line);border-radius:8px 8px 0 0;flex:0 0 auto;
  align-items:center;position:relative}
.tab{display:flex;align-items:center;gap:0;border:1px solid var(--line);
  border-radius:6px;overflow:hidden;background:#232b34}
.tab.on{background:#1f6f36;border-color:#2ea043}
.tab button{border:0;border-radius:0;background:transparent;min-height:28px}
.tab .lbl{padding:6px 8px;max-width:34vw;overflow:hidden;text-overflow:ellipsis;
  cursor:grab;touch-action:none;user-select:none}
.tab.held{opacity:.45}
body.dragging{cursor:grabbing;user-select:none}
body.dragging .tab .lbl{cursor:grabbing}
.tab .ic{padding:6px 7px;color:var(--dim);font-size:13px;line-height:1}
.tab .ic:hover{background:rgba(255,255,255,.09);color:var(--ink)}
@media(max-width:900px){ .tab button{min-height:var(--tap)} }
.tabbar .sep{flex:1}

.pinmenu{position:absolute;z-index:20;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:5px;display:flex;
  gap:5px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.pinmenu button{min-height:var(--tap)}
/* The resume label can be a sentence, and the sidebar is narrow — wrap inside
   the card rather than hanging off its edge. */
.resumemenu{max-width:calc(100% - 8px);flex-wrap:wrap}
.resumemenu button{white-space:normal;text-align:left}

/* Panes -------------------------------------------------------------- */
.panes{flex:1;min-height:0;display:grid;gap:6px;grid-template-columns:1fr;
  background:var(--line);border:1px solid var(--line);border-top:0;
  border-radius:0 0 8px 8px;overflow:hidden}
.panes.split{grid-template-columns:1fr 1fr}
@media(max-width:900px){ .panes.split{grid-template-columns:1fr} }
.pane{position:relative;background:#000;min-height:0;display:flex;flex-direction:column}
.pane.hidden{display:none}
.pane.active{outline:2px solid #2ea043;outline-offset:-2px}
.pane .bar{display:flex;align-items:center;gap:6px;padding:3px 6px;
  background:rgba(20,24,29,.92);border-bottom:1px solid var(--line);
  font:11px/1.6 var(--mono);color:var(--dim);flex:0 0 auto}
.pane .bar .x{margin-left:auto;cursor:pointer;padding:2px 7px;border-radius:4px}
.pane .bar .x:hover{background:rgba(255,255,255,.1);color:var(--ink)}
.pane .bar button{min-height:22px;padding:2px 8px;font-size:11px}
.pane iframe{flex:1;border:0;width:100%;display:block}
.pane .doc{flex:1;overflow:auto;background:var(--bg);padding:12px;
  -webkit-overflow-scrolling:touch}
.pane .slot{flex:1;min-height:0;display:flex}
.pane .empty-pane{margin:auto;color:var(--dim);font-style:italic}

/* Keys --------------------------------------------------------------- */
.keys{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);
  border-top:0;border-radius:0 0 8px 8px;padding:6px;display:none;gap:5px;flex-wrap:wrap}
.keys.show{display:flex}
.keys button{font-family:var(--mono);min-width:40px;min-height:var(--tap);padding:6px 8px}
.keys .gap{flex-basis:100%;height:0}

/* Findings view ------------------------------------------------------ */
.fx h3{margin:0 0 8px;font-size:15px}
.fx .stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fx .grp{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;
  background:var(--panel);overflow:hidden}
.fx .grp>summary{padding:9px 11px;cursor:pointer;font-weight:600;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;list-style:none}
.fx .grp>summary::-webkit-details-marker{display:none}
.fx .grp>summary::before{content:"▸";color:var(--dim);font-size:11px}
.fx .grp[open]>summary::before{content:"▾"}
.fx .bust{padding:9px 11px;color:var(--bad);font-weight:600}
.fx .rule{border-top:1px solid var(--line);padding:9px 11px}
.fx .rule .rid{font:12px/1.5 var(--mono);color:var(--dim);word-break:break-all}
.fx .rule .desc{margin:3px 0 6px}
.fx .loc{font:12px/1.7 var(--mono);color:#cbd5e1}
.fx .msg{font:12px/1.5 var(--mono);color:var(--dim);white-space:pre-wrap;
  margin:5px 0 0;padding-left:9px;border-left:2px solid var(--line)}
.fx a{color:var(--note)}
.fx .cve{display:inline-block;font:11px/1 var(--mono);padding:3px 7px;
  border-radius:99px;border:1px solid #4d2220;color:var(--bad);
  text-decoration:none;margin:0 4px 4px 0}
.fx .cve:hover{background:#2a1a1a}
</style>
</head>
<body data-view="dash">
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="box">
    <h3 id="mTitle">New custom command</h3>
    <div class="field">
      <label for="mName">Title</label>
      <input id="mName" maxlength="60" autocomplete="off" spellcheck="false"
             placeholder="e.g. rebuild and test">
    </div>
    <div class="field">
      <label for="mBody">Commands</label>
      <textarea id="mBody" spellcheck="false" autocomplete="off"
                placeholder="./gradlew clean&#10;./gradlew test"></textarea>
      <div class="hint">One per line. They are typed into the terminal you are
        looking at, in order, exactly as if you had typed them.</div>
    </div>
    <div class="foot">
      <button id="mSave" class="primary">Save</button>
      <button id="mCancel">Cancel</button>
      <span class="sp"></span>
      <button id="mDelete" class="danger" hidden>Delete</button>
    </div>
  </div>
</div>
<header>
  <!-- The mark doubles as the connection light: green while the dashboard can
       reach the container, red when it cannot. A mask rather than painted-in
       eyes, so the cut-outs are transparent and one `color` tints the whole
       thing. -->
  <svg class="logo" id="dot" viewBox="0 0 32 32" aria-hidden="true">
    <mask id="bb-mask">
      <rect width="32" height="32" fill="#000"/>
      <rect x="4" y="8.5" width="24" height="17" rx="5.5" fill="#fff"/>
      <rect x="15" y="3.5" width="2" height="6" rx="1" fill="#fff"/>
      <circle cx="16" cy="3" r="2.3" fill="#fff"/>
      <circle cx="11.4" cy="15.4" r="2.1" fill="#000"/>
      <circle cx="20.6" cy="15.4" r="2.1" fill="#000"/>
      <rect x="10.6" y="19.6" width="10.8" height="2.6" rx="1.3" fill="#000"/>
    </mask>
    <rect width="32" height="32" fill="currentColor" mask="url(#bb-mask)"/>
  </svg>
  <h1>BuilderBot</h1>
  <span class="meta host" id="host"></span>
  <span class="spacer"></span>
  <span class="meta" id="uptime"></span>
  <button onclick="refresh()">↻</button>
</header>

<div class="switch">
  <button id="vDash" class="on" onclick="setView('dash')">Dashboard</button>
  <button id="vTerm" onclick="setView('terminal')">Terminal</button>
</div>

<main>
  <div class="col side">
    <div class="card">
      <h2>Runner</h2>
      <div id="runner"><div class="empty">loading…</div></div>
    </div>
    <div class="card">
      <h2>Projects<span id="projTog"></span></h2>
      <div id="projects"><div class="empty">loading…</div></div>
    </div>
    <div class="card" id="cardFindings" hidden>
      <h2>Static analysis</h2>
      <div class="macros">
        <button class="primary" onclick="openFindings()">Open findings report</button>
      </div>
    </div>
    <div class="card">
      <h2>Sessions</h2>
      <div id="sessions"><div class="empty">loading…</div></div>
    </div>
    <div class="card doctor">
      <h2><span class="st" id="docDot" hidden></span>Doctor<span id="docTog"
        ><span id="docWhen"></span
        ><button id="bDocTog" hidden></button
        ><button id="bDoctor" title="run bb doctor now">↻</button></span></h2>
      <div id="doctor"><div class="empty">first run pending…</div></div>
    </div>
    <div class="card">
      <h2>bb commands<span id="cmdTog"></span></h2>
      <div class="macros" id="commands"><div class="empty">loading…</div></div>
    </div>
    <div class="card">
      <h2>Custom commands<span><button id="bAdd" title="new custom command">+</button></span></h2>
      <div class="macros" id="custom"></div>
    </div>
  </div>

  <div class="col term">
    <div class="tabbar" id="tabbar"></div>
    <div class="panes" id="panes">
      <div class="pane active" id="pane0"></div>
      <div class="pane hidden" id="pane1"></div>
    </div>
    <div class="keys" id="keys"></div>
  </div>
</main>

<script>
"use strict";

// ---- state -----------------------------------------------------------
// The workspace tab is only the default the page starts with, not a fixture:
// every tab can be minimised, and killing a session from the Sessions card
// takes its tab with it — the workspace one included, which used to be
// unclosable and so sat pointing at a dead session. An empty strip is legal;
// the pane renders a placeholder and "+" starts over. Tabs are separate from
// panes on purpose: a pane is a viewport, and closing one should not destroy
// what it was showing.
let tabs = [{id:"ws", kind:"term", arg:"shell", label:"sh: workspace"}];
let panes = ["ws", null];
let active = 0;
let state = null;
let findings = null;
let pinFor = null;
let showKeys = window.matchMedia("(pointer: coarse)").matches;
let seq = 0;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tabOf = id => tabs.find(t => t.id === id) || null;
const isSplit = () => panes[1] !== null;

// Mirrors bb-tty. The key bar, the kill button and the macro sender all address
// tmux by name, and the terminal is an iframe we cannot reach into, so they
// must agree. A resumed conversation is the same session as a fresh one — the
// suffix chooses what claude starts with, not which tmux session it lands in.
function sessionOf(arg){
  if (arg.startsWith("sh:")){
    const [, n, proj] = arg.split(":");
    return proj ? `shell-${proj}-${n}` : `shell-${n}`;
  }
  if (arg.startsWith("claude:")) return "claude-" + arg.slice(7).split(":")[0];
  if (arg.startsWith("shell:"))  return "shell-"  + arg.slice(6);
  return arg;
}

const isClaude = t => t.kind === "term" && sessionOf(t.arg).startsWith("claude-");
const liveSessions = () => new Set((state?.sessions || []).map(s => s.name));

// What a Claude session is doing — {state: "working"|"waiting", task} — read
// from the pane title the server collected, or null for anything else. The
// distinction the badge carries is the phone-glance question: is it still
// going, or is it sitting there needing me?
const claudeOf = name =>
  (state?.sessions || []).find(s => s.name === name)?.claude || null;

const stateDot = c => c
  ? `<span class="st ${c.state}" title="${c.state === "working"
      ? "working" : "waiting for you"}"></span>` : "";

// ---- what a tab is called --------------------------------------------
// Derived at draw time from where the terminal *is*, not from the argument it
// was opened with — so a `cd` shows up in the strip. The stored label is only
// the fallback for a session tmux does not know about yet.
const cwdOf = session => (state?.sessions || []).find(s => s.name === session)?.cwd || "";
const baseOf = path => path.replace(/\/+$/, "").split("/").pop() || "/";

// One naming rule, computed from the session list and read by both the tab
// strip and the Sessions card. A tab and its session are the same thing, so
// they must not be able to disagree about what that thing is called — including
// after the tab is closed, when the session is all that is left.
//
// Two terminals in one directory would be indistinguishable, so the duplicates
// — and only the duplicates — carry a number.
function sessionLabels(){
  const list = (state?.sessions || []);
  const of = s => s.name.startsWith("claude-") ? "Claude: " + s.name.slice(7)
           : s.cwd ? "sh: " + baseOf(s.cwd)
           : "sh: " + s.name;
  const total = {};
  list.forEach(s => { const l = of(s); total[l] = (total[l] || 0) + 1; });
  const nth = {}, out = new Map();
  for (const s of list){
    const l = of(s);
    nth[l] = (nth[l] || 0) + 1;
    out.set(s.name, total[l] > 1 ? `${l} ${nth[l]}` : l);
  }
  return out;
}

function tabLabel(t){
  if (t.kind !== "term") return t.label;
  // Falls back to the stored label only while tmux has yet to register a
  // just-opened session.
  return sessionLabels().get(sessionOf(t.arg)) || t.label;
}

// The tooltip is the full path, which is the thing a basename loses — plus,
// for a Claude tab, what the session says it is doing.
function tabTitle(t){
  if (t.kind !== "term") return t.label;
  const base = cwdOf(sessionOf(t.arg)) || t.label;
  const c = isClaude(t) ? claudeOf(sessionOf(t.arg)) : null;
  return c?.task ? `${base}\n${c.state === "working" ? "working on" : "done"}: ${c.task}` : base;
}

function tabLabels(){
  return new Map(tabs.map(t => [t.id, tabLabel(t)]));
}

// The next free numbered terminal for a project ("" = the workspace root).
// Checked against live tmux sessions as well as open tabs, so a tab closed
// without killing its session does not hand the number back out.
function nextShell(proj){
  const taken = new Set([...liveSessions(),
                         ...tabs.filter(t => t.kind === "term").map(t => sessionOf(t.arg))]);
  const base = proj ? `shell-${proj}` : "shell";
  for (let n = 1; n <= 99; n++)
    if (!taken.has(`${base}-${n}`)) return `sh:${n}:${proj}`;
  return null;
}

const ttydUrl = arg =>
  `${location.protocol}//${location.hostname}:${state.ttyd_port}/?arg=${encodeURIComponent(arg)}`;

const isPhone = () => window.matchMedia("(max-width:900px)").matches;

const dur = s =>
  s < 60   ? `${s}s` :
  s < 3600 ? `${Math.floor(s/60)}m ${s%60}s` :
             `${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`;

function setView(v){
  document.body.dataset.view = v;
  $("vDash").classList.toggle("on", v === "dash");
  $("vTerm").classList.toggle("on", v === "terminal");
}

// ---- tabs ------------------------------------------------------------
// What makes two tabs the same tab. For a terminal it is the tmux session,
// NOT the argument that produced it: "claude:FreshBoot" from the project list
// and "claude-FreshBoot" from the session list are different strings naming
// one session, and letting both exist puts two ✕ buttons on it.
const identity = t => t.kind === "term" ? "tmux:" + sessionOf(t.arg)
                                        : t.kind + ":" + t.arg;

// One tab per thing. A second click on Claude or Findings for something already
// open is a request to go to it, not to open a duplicate. Shell tabs are the
// exception and are always new — each carries its own session name, so they
// never collide here.
function openTab(spec){
  let t = tabs.find(x => identity(x) === identity(spec));
  if (!t){
    if (!roomForTab()) return;
    t = Object.assign({id:"t" + (++seq)}, spec);
    tabs.push(t);
  }
  const shown = panes.indexOf(t.id);
  if (shown === -1) panes[active] = t.id;    // not on screen — put it here
  else active = shown;                       // already on screen — focus it
  show(t);
}

// Each terminal tab is an iframe running a full xterm.js over its own
// websocket. Past a point the page stops being usable and the container is
// carrying sessions nobody is reading, so refuse rather than degrade.
function roomForTab(){
  const cap = state?.max_tabs || 12;
  if (tabs.length < cap) return true;
  notify(`Tab limit reached (${cap}). Minimise one first — it keeps running. `
       + `DASHBOARD_MAX_TABS raises the limit if this box can take more.`, true);
  return false;
}

function focusTab(id){
  const t = tabOf(id);
  if (!t) return;
  const shown = panes.indexOf(id);
  if (shown === -1) panes[active] = id; else active = shown;
  show(t);
}

// Common tail of "make this tab the one being looked at".
function show(t){
  pinFor = null;
  render();
  if (isPhone()) setView("terminal");
  if (t.kind === "findings" && !findings) loadFindings();
}

// Take a tab off the strip. Nothing is destroyed and nothing is asked: a
// terminal keeps running and is listed under Sessions, a document is a view of
// a file on disk. Ending a session for good is the ✕ in the Sessions card,
// which is where a question is worth asking because something is actually lost.
function hideTab(id, ev){
  ev?.stopPropagation();
  const t = tabOf(id);
  if (!t) return;
  dropTab(id);
  refresh();
}

// Remove a tab and repair the layout: a pane it was in falls back to the other
// one, then to whatever tab is still open, then to nothing — which drawPanes
// renders as a placeholder rather than this function preventing.
function dropTab(id){
  tabs = tabs.filter(x => x.id !== id);
  for (let i = 0; i < 2; i++) if (panes[i] === id) panes[i] = null;
  if (panes[0] === null && panes[1] !== null){ panes[0] = panes[1]; panes[1] = null; }
  if (panes[0] === null) panes[0] = tabs[0]?.id ?? null;
  if (panes[1] === null) active = 0;
  render();
}

function pinTo(id, idx, ev){
  ev?.stopPropagation();
  pinFor = null;
  const other = 1 - idx;
  if (panes[other] === id){
    // It is already in the other pane. That pane needs something else or the
    // tab renders twice — two iframes attaching to one tmux session.
    const fill = tabs.find(t => t.id !== id)?.id ?? null;
    if (idx === 1 && fill === null){ render(); return; }  // nothing to sit beside it
    panes[other] = idx === 1 ? fill : null;
  }
  panes[idx] = id;
  active = idx;
  render();
}

// Closing a pane collapses the layout. It must not close the tab — the tab is
// the thing that owns a session, the pane is only where it was being shown.
function closePane(idx, ev){
  ev?.stopPropagation();
  if (idx === 1){ panes[1] = null; active = 0; }
  else { panes[0] = panes[1] ?? tabs[0]?.id ?? null; panes[1] = null; active = 0; }
  render();
}

function togglePin(id, ev){
  ev.stopPropagation();
  pinFor = pinFor === id ? null : id;
  drawTabs();
}

// Positioning happens in drawTabs, not here, because the tab bar is rebuilt on
// every status poll: anything measured at click time is gone 15 seconds later.
function placePinMenu(){
  const menu = $("pinmenu"), anchor = $("tabbar").querySelector(`.tab[data-id="${pinFor}"]`);
  if (!menu || !anchor) return;
  const a = anchor.getBoundingClientRect(), bar = $("tabbar").getBoundingClientRect();
  menu.style.left = Math.max(4, Math.min(a.left - bar.left,
                                         bar.width - menu.offsetWidth - 4)) + "px";
  menu.style.top = (a.bottom - bar.top + 4) + "px";
}

// ---- drag to reorder -------------------------------------------------
// Pointer events rather than HTML5 drag-and-drop, which does not exist on
// touch. Move/up are bound to the window because drawTabs replaces the very
// element the gesture started on.
let drag = null, swallowClick = false;

function startDrag(ev, id){
  if (ev.pointerType === "mouse" && ev.button !== 0) return;
  drag = {id, x0: ev.clientX, y0: ev.clientY, moved: false};
  window.addEventListener("pointermove", onDrag);
  window.addEventListener("pointerup", endDrag, {once: true});
  window.addEventListener("pointercancel", endDrag, {once: true});
}

// Where the dragged tab belongs: the number of *other* tabs that come before
// the pointer in reading order. That is exactly the insertion index once the
// dragged tab is spliced out, and it handles a wrapped tab bar for free.
function dropIndex(x, y, from){
  let idx = 0;
  [...$("tabbar").querySelectorAll(".tab")].forEach((el, i) => {
    if (i === from) return;
    const r = el.getBoundingClientRect();
    if (y > r.bottom || (y >= r.top && x > r.left + r.width / 2)) idx++;
  });
  return idx;
}

function onDrag(ev){
  if (!drag) return;
  if (!drag.moved){
    // A few pixels of slop, so an ordinary click is not read as a drag.
    if (Math.hypot(ev.clientX - drag.x0, ev.clientY - drag.y0) < 6) return;
    drag.moved = true; pinFor = null;
    document.body.classList.add("dragging");
  }
  ev.preventDefault();
  const from = tabs.findIndex(t => t.id === drag.id);
  if (from < 0) return;
  const to = dropIndex(ev.clientX, ev.clientY, from);
  if (to !== from){
    tabs.splice(to, 0, tabs.splice(from, 1)[0]);
    drawTabs();
  }
}

function endDrag(){
  window.removeEventListener("pointermove", onDrag);
  document.body.classList.remove("dragging");
  const moved = drag?.moved;
  drag = null;
  // Redraw ONLY after a real drag. `click` is dispatched after `pointerup`, so
  // rebuilding the tab bar here would replace the button mid-gesture and the
  // click would never reach a handler — every tab click silently doing nothing.
  if (!moved) return;
  swallowClick = true;                  // ...and the click ending a drag is not
  setTimeout(() => swallowClick = false, 0);   //    a request to switch tabs
  drawTabs();
}

function drawTabs(){
  const cur = panes[active], names = tabLabels();
  const html = tabs.map(t => {
    const where = panes[0] === t.id ? "◧" : panes[1] === t.id ? "◨" : "";
    const held = drag?.moved && drag.id === t.id ? " held" : "";
    return `<span class="tab ${t.id===cur?"on":""}${held}" data-id="${esc(t.id)}">
      <button class="lbl" data-show="${esc(t.id)}" title="${esc(tabTitle(t))}">${isClaude(t) ? stateDot(claudeOf(sessionOf(t.arg))) : ""}${esc(names.get(t.id))}${where?` <span style="opacity:.7">${where}</span>`:""}</button>
      <button class="ic" data-pin="${esc(t.id)}" title="pin to a pane">⇱</button>
      ${
        // A terminal is minimised, not closed: it keeps running and is listed
        // under Sessions — the workspace tab the same as any other. A document
        // has nothing to keep, so its ✕ means what it says. Neither asks —
        // nothing is lost either way.
        t.kind === "term"
          ? `<button class="ic" data-min="${esc(t.id)}"
               title="minimise — the terminal keeps running, reopen it from Sessions">—</button>`
          : `<button class="ic" data-close="${esc(t.id)}" title="close">✕</button>`}
    </span>`;
  }).join("");

  $("tabbar").innerHTML =
    `<button id="bNew" class="ic newtab" title="new terminal at /workspace">+</button>` +
    html +
    `<span class="sep"></span>` +
    `<button id="bKeys" class="${showKeys?"on":""}" title="on-screen keys">⌨</button>` +
    (pinFor ? `<span class="pinmenu" id="pinmenu">
        <button data-l="${esc(pinFor)}">◧ Left</button>
        <button data-r="${esc(pinFor)}">◨ Right</button>
      </span>` : "");

  const bar = $("tabbar");
  bar.querySelectorAll("[data-show]").forEach(b => {
    b.onpointerdown = e => startDrag(e, b.dataset.show);
    b.onclick = () => { if (!swallowClick) focusTab(b.dataset.show); };
  });
  // Middle-click does the same as the tab's own button, the way a browser tab
  // does. `click` never fires for button 1 and pointerdown would arm the
  // autoscroll cursor first, so this is auxclick with the default suppressed.
  bar.querySelectorAll(".tab").forEach(el => {
    el.onpointerdown = e => { if (e.button === 1) e.preventDefault(); };
    el.onauxclick = e => {
      if (e.button !== 1) return;
      e.preventDefault();
      hideTab(el.dataset.id, e);
    };
  });
  bar.querySelectorAll("[data-pin]").forEach(b => b.onclick = e => togglePin(b.dataset.pin, e));
  bar.querySelectorAll("[data-min]").forEach(b => b.onclick = e => hideTab(b.dataset.min, e));
  bar.querySelectorAll("[data-close]").forEach(b => b.onclick = e => hideTab(b.dataset.close, e));
  bar.querySelectorAll("[data-l]").forEach(b => b.onclick = e => pinTo(b.dataset.l, 0, e));
  bar.querySelectorAll("[data-r]").forEach(b => b.onclick = e => pinTo(b.dataset.r, 1, e));
  $("bKeys").onclick = () => { showKeys = !showKeys; render(); };
  $("bNew").onclick = () => newShell("");
  if (pinFor) placePinMenu();
}

// A terminal at some directory, always a new one. "" is the workspace root.
function newShell(proj){
  const arg = nextShell(proj);
  if (!arg){ notify("Too many terminals open for that directory.", true); return; }
  openTab({kind:"term", arg, label: `sh: ${proj || "workspace"}`});
}

// ---- panes -----------------------------------------------------------
// The pane's title bar is redrawn on every pass — it is cheap, and its close
// button only exists while the layout is split. The pane *body* is left alone
// whenever the same tab is still in it, because rebuilding it would reload the
// iframe and drop a live terminal for no reason.
function paintBar(pane, t, i){
  const closeBtn = isSplit()
    ? `<span class="x" data-cp="${i}" title="close this pane">✕</span>` : "";
  const reload = t.kind === "findings"
    ? `<button class="ic" data-reload="1" style="margin-left:8px">reload</button>` : "";
  const bar = pane.querySelector(".bar");
  bar.innerHTML = `<span title="${esc(tabTitle(t))}">${esc(tabLabel(t))}</span>${reload}${closeBtn}`;
  bar.querySelectorAll("[data-cp]").forEach(b =>
    b.onclick = e => closePane(Number(b.dataset.cp), e));
  bar.querySelectorAll("[data-reload]").forEach(b =>
    b.onclick = e => { e.stopPropagation(); loadFindings(true); });
}

function drawPanes(){
  $("panes").classList.toggle("split", isSplit());
  for (let i = 0; i < 2; i++){
    const pane = $("pane" + i);
    pane.classList.toggle("hidden", i === 1 && !isSplit());
    pane.classList.toggle("active", isSplit() && i === active);
    if (i === 1 && !isSplit()) continue;

    const t = tabOf(panes[i]);
    const same = pane.dataset.tab === (t?.id || "") && pane.dataset.kind === (t?.kind || "");
    if (same && t){
      paintBar(pane, t, i);
      // Refill a document pane only when the report itself changed. Doing it
      // on every status poll would fight the reader for control of the page.
      if (t.kind === "findings" && pane.dataset.rev !== String(findingsRev)){
        pane.dataset.rev = String(findingsRev);
        renderFindingsInto(i);
      }
      continue;
    }
    if (same) continue;

    pane.dataset.tab = t?.id || ""; pane.dataset.kind = t?.kind || "";
    pane.onclick = () => { if (isSplit()){ active = i; render(); } };

    if (!t){ pane.innerHTML = `<div class="empty-pane">no tab here — “+” opens a terminal, Sessions reopens a running one</div>`; continue; }
    pane.innerHTML = `<div class="bar"></div>` + (t.kind === "term"
      // Selecting in a shell copies: the terminal fires the copy itself, and
      // this is the permission that lets it, since the terminal is served from
      // its own port and so counts as a cross-origin frame. Claude tabs are
      // left without it — they keep tmux's mouse mode, where a drag never
      // becomes a browser selection in the first place.
      ? `<div class="slot"><iframe title="${esc(tabLabel(t))}"${isClaude(t) ? "" : ` allow="clipboard-write"`} src="${esc(ttydUrl(t.arg))}"></iframe></div>`
      : `<div class="doc fx" id="doc${i}"></div>`);
    paintBar(pane, t, i);
    if (t.kind === "findings"){ pane.dataset.rev = String(findingsRev); renderFindingsInto(i); }
  }
}

// Two browsers attached to one tmux session fight over its size: tmux sizes a
// window to whichever client used it last, and paints the spare rows of the
// bigger client with dots until that client does something. The terminal is
// served from its own port, so we cannot ask it to refit — but resizing its
// frame makes it refit itself, and the size comes back here.
//
// Done when this page returns to the front, which is exactly when the other
// device has been the one using it.
let nudgeTimer = null;
function nudgeTerminals(){
  const frames = [...document.querySelectorAll(".pane iframe")];
  if (!frames.length) return;
  clearTimeout(nudgeTimer);
  frames.forEach(f => f.style.width = "calc(100% - 1px)");
  // A frame has to be laid out at the new width for the resize to reach the
  // document inside it, so this cannot be folded into an animation frame.
  nudgeTimer = setTimeout(() => frames.forEach(f => f.style.width = ""), 60);
}

document.addEventListener("visibilitychange", () => { if (!document.hidden) nudgeTerminals(); });
window.addEventListener("focus", nudgeTerminals);

// ---- keys ------------------------------------------------------------
const KEYS = [
  [["escape","Esc"],["tab","Tab"],["left","←"],["down","↓"],["up","↑"],["right","→"],
   ["home","Home"],["end","End"],["pgup","PgUp"],["pgdn","PgDn"]],
  [["ctrl-c","^C"],["ctrl-d","^D"],["ctrl-z","^Z"],["ctrl-l","^L"],["ctrl-r","^R"],
   ["ctrl-a","^A"],["ctrl-e","^E"],["ctrl-u","^U"],["ctrl-w","^W"],["enter","⏎"]],
  [["pipe","|"],["tilde","~"],["slash","/"],["backslash","\\"],["dash","-"],
   ["under","_"],["dollar","$"],["star","*"],["lt","<"],["gt",">"]],
];

function drawKeys(){
  const el = $("keys");
  const t = tabOf(panes[active]);
  const on = showKeys && t?.kind === "term";     // pointless over a document
  el.classList.toggle("show", on);
  if (!on){ el.innerHTML = ""; return; }
  el.innerHTML = KEYS.map(r =>
    r.map(([k,l]) => `<button data-k="${esc(k)}">${esc(l)}</button>`).join("")
  ).join('<span class="gap"></span>');
  el.querySelectorAll("[data-k]").forEach(b => b.onclick = () => sendKey(b.dataset.k));
}

async function sendKey(key){
  const t = tabOf(panes[active]);
  if (!t || t.kind !== "term") return;
  try{
    const r = await fetch("/api/keys", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({session: sessionOf(t.arg), key})});
    const j = await r.json();
    if (j.error) notify("key: " + j.error, true);
  }catch(e){ notify("key failed: " + e, true); }
}

// ---- findings --------------------------------------------------------
const LEVEL_ORDER = {error:0, warning:1, note:2, info:2, none:3};
const levelClass = l => l === "error" ? "bad" : l === "warning" ? "warn"
                      : (l === "note" || l === "info") ? "note" : "";

// Bumped only when the data actually changes. The status poll redraws every
// 15s, and re-rendering the report on each pass threw away whatever the reader
// had collapsed — and their scroll position with it.
let findingsRev = 0;

// The reports' mtime as of the last load, so a scan re-run on the host shows
// up on its own: the status poll carries the current mtime, and a mismatch
// while a findings tab is open triggers a reload. Only then — reloading on a
// timer would fight the reader for the page (their collapsed sections do
// survive, but their scroll position does not).
let findingsMtime = null;

async function loadFindings(force){
  if (findings && !force) return;
  findingsMtime = state?.reports_mtime ?? null;
  findings = {loading:true}; findingsRev++;
  drawPanes();
  try{
    const r = await fetch("/api/findings");
    findings = await r.json();
  }catch(e){ findings = {error:String(e)}; }
  findingsRev++;
  drawPanes();
}

// Which project sections the reader has collapsed, kept across re-renders so a
// reload of the report does not undo their triage.
const collapsed = new Set();

function renderFindingsInto(i){
  const el = $("doc" + i);
  if (!el) return;
  if (!findings || findings.loading){ el.innerHTML = `<div class="empty">loading…</div>`; return; }
  if (findings.error){ el.innerHTML = `<div class="empty">${esc(findings.error)}</div>`; return; }
  if (!findings.available){
    el.innerHTML = `<div class="empty">No /reports mount. Point the container's
      scanner-reports path at your scanner's output directory.</div>`; return;
  }

  const all = [];
  for (const rep of findings.reports)
    for (const f of rep.findings) all.push(Object.assign({tool: rep.tool}, f));
  const errs = findings.reports.filter(r => r.error);

  if (!all.length){
    el.innerHTML = `<h3>No findings</h3>
      <p class="empty">Reports parsed: ${findings.reports.map(r=>esc(r.file)).join(", ") || "none"}.
      Remember an absent project has not necessarily passed — SARIF records
      findings, not coverage.</p>` + errs.map(r =>
        `<div class="empty">${esc(r.file)}: ${esc(r.error)}</div>`).join("");
    return;
  }

  const by = (rows, k) => rows.reduce((m,x) => ((m[x[k] ?? "—"] ??= []).push(x), m), {});
  const counts = by(all, "level");
  const stat = Object.keys(counts).sort((a,b)=>(LEVEL_ORDER[a]??9)-(LEVEL_ORDER[b]??9))
    .map(l => `<span class="pill ${levelClass(l)}">${esc(l)} ${counts[l].length}</span>`).join("");

  const cveCount = new Set(all.flatMap(f => f.cves)).size;
  const projects = by(all, "project");

  // One report per tool is the common case, but a tool can write several and
  // an unparsed one has no name at all — so dedupe and drop the unknowns.
  const tools = [...new Set(findings.reports.map(r => r.tool).filter(t => t && t !== "?"))];

  let html = `<h3>Findings (${all.length})</h3><div class="stats">${stat}
    <span class="pill">${Object.keys(projects).length} projects</span>
    ${cveCount ? `<span class="pill bad">${cveCount} CVEs</span>` : ""}
    ${tools.length ? `<span class="pill">${esc(tools.join(" · "))}</span>` : ""}
  </div>`;

  html += errs.map(r =>
    `<div class="grp bust">${esc(r.file)} could not be parsed: ${esc(r.error)}</div>`
  ).join("");

  const projNames = Object.keys(projects).sort((a,b) => (a==="—")-(b==="—") || a.localeCompare(b));
  for (const proj of projNames){
    const rows = projects[proj];
    const lv = by(rows, "level");
    const badges = Object.keys(lv).sort((a,b)=>(LEVEL_ORDER[a]??9)-(LEVEL_ORDER[b]??9))
      .map(l => `<span class="pill ${levelClass(l)}">${esc(l)} ${lv[l].length}</span>`).join("");

    const shut = collapsed.has(proj) || proj === "—";
    html += `<details class="grp" data-proj="${esc(proj)}" ${shut?"":"open"}>
      <summary>${esc(proj === "—" ? "unattributed paths" : proj)} ${badges}</summary>`;

    const rules = by(rows, "rule");
    // Worst hit first, so a rule that fires at two levels is labelled by the
    // one that matters rather than by whichever the scanner happened to emit.
    for (const k of Object.keys(rules))
      rules[k].sort((a,b) => (LEVEL_ORDER[a.level]??9)-(LEVEL_ORDER[b.level]??9));
    const order = Object.keys(rules).sort((a,b) =>
      (LEVEL_ORDER[rules[a][0].level]??9)-(LEVEL_ORDER[rules[b][0].level]??9)
      || rules[b].length - rules[a].length);

    for (const rid of order){
      const hits = rules[rid];
      const f = hits[0];
      const cves = [...new Set(hits.flatMap(h => h.cves))];
      html += `<div class="rule">
        <div class="rid">
          <span class="pill ${levelClass(f.level)}">${esc(f.level)}</span>
          ${f.uri ? `<a href="${esc(f.uri)}" target="_blank" rel="noopener">${esc(rid)}</a>`
                  : esc(rid)} · ${hits.length}
        </div>
        <div class="desc">${esc(f.desc || "(no description)")}</div>
        ${cves.map(c => `<a class="cve" target="_blank" rel="noopener"
            href="https://nvd.nist.gov/vuln/detail/${esc(c)}">${esc(c)}</a>`).join("")}
        <div>${hits.map(h => `<div class="loc">${esc(h.path)}:${h.line}</div>`).join("")}</div>
        ${f.message && f.message !== f.desc
            ? `<div class="msg">${esc(f.message.slice(0, 600))}</div>` : ""}
      </div>`;
    }
    html += `</details>`;
  }
  el.innerHTML = html;
  el.querySelectorAll("details[data-proj]").forEach(d =>
    d.addEventListener("toggle", () =>
      d.open ? collapsed.delete(d.dataset.proj) : collapsed.add(d.dataset.proj)));
}

// ---- sidebar ---------------------------------------------------------
function drawRunner(r){
  const el = $("runner");
  if (!r.enabled){ el.innerHTML = '<div class="empty">disabled (ENABLE_RUNNER=false)</div>'; return; }
  // Order matters. A Listener process is up while a job runs *and* while the
  // runner is being refused by GitHub and retrying, so "listening" is the
  // weakest of the three claims and has to be checked last.
  //
  // Unregistered is two different states. An ephemeral registration is
  // single-use: the runner deregisters itself the moment a job finishes and
  // the supervisor re-registers it seconds later, so unregistered *with the
  // supervisor up* is the healthy between-jobs path — a red pill here sent
  // the operator hunting for an outage that was the design working. Red is
  // reserved for unregistered with nothing coming to fix it.
  const stuck = r.listening && r.connected === false;
  const cls = stuck  ? "bad"
            : r.busy ? "note"
            : r.listening ? "ok"
            : r.registered || r.running ? "warn" : "bad";
  const txt = stuck  ? "cannot connect — retrying"
            : r.busy ? (r.job ? `running job: ${r.job}` : "running a job")
            : r.listening ? "listening for jobs"
            : r.registered ? "registered, between jobs"
            : r.running ? "re-registering — a job just finished" : "not registered";
  el.innerHTML =
    `<div class="row"><span class="pill ${cls}">${esc(txt)}</span>` +
    ((r.busy || stuck) ? `<span class="spin${stuck?" bad":""}" title="${
        stuck ? "retrying the connection to GitHub" : "a job is executing in this container"
      }"></span>` : "") +
    (r.busy && !stuck && r.elapsed != null ? `<span class="sub">${esc(dur(r.elapsed))}</span>` : "") +
    `</div>` +
    (stuck ? `<div class="row"><span class="sub">${esc(r.detail || "")}</span></div>
      <div class="row"><span class="sub">Usually another process holding this
        runner's name. It clears when GitHub expires the old session; if it
        does not, check for a stray listener with
        <code>pgrep -af Runner.Listener</code>.</span></div>` : "") +
    (r.name ? `<div class="row"><span class="sub">${esc(r.name)} → ${esc(r.url||"")}</span></div>` : "") +
    // One toggle rather than a Restart that silently means stop-and-start.
    // Stopping waits for GitHub to release the session, so it is not instant —
    // the button says so instead of looking wedged.
    `<div class="macros">${
      [["runner-status", "Status", ""],
       r.running ? ["runner-stop", "Stop", ""]
                 : ["runner-start", "Start", "primary"]
      ].map(([m, label, cls]) =>
        `<button class="${cls}" data-m="${m}">${label}</button>`).join("")
    }</div>`;
  el.querySelectorAll("[data-m]").forEach(b => b.onclick = () => macro(b.dataset.m));
}

// What gets folded away is what the button says: projects with an *error*, and
// ones excluded on purpose. A warning is not an error — a repo with no
// CLAUDE.md or one whose environment block has drifted still works, and hiding
// it would bury the very thing the amber text is asking for. The only thing
// never listed at all is an empty directory, which the server drops: it is not
// a problem to fix but a mount point waiting for content.
const isBroken = p => p.issues.some(i => i.level === "error" || i.level === "excluded");

let showAllProjects = false;

function drawProjects(ps){
  const el = $("projects"), tog = $("projTog");
  const flagged = ps.filter(isBroken);
  // Excluded last: it is not a problem waiting to be fixed like the rest of
  // what is folded away here, it is a decision already made.
  const shown   = (showAllProjects ? ps : ps.filter(p => !isBroken(p)))
                  .slice().sort((a, b) => (a.excluded ? 1 : 0) - (b.excluded ? 1 : 0));

  tog.innerHTML = flagged.length
    ? `<button id="bAll">${showAllProjects ? "Hide" : "Show"} projects with errors (${flagged.length})</button>`
    : "";
  if (flagged.length)
    $("bAll").onclick = () => { showAllProjects = !showAllProjects; drawProjects(ps); };

  if (!shown.length){
    el.innerHTML = `<div class="empty">${
      !ps.length ? "nothing mounted under /workspace"
                 : `${flagged.length} ${flagged.length===1?"project needs":"projects need"} attention — use Show projects with errors`
    }</div>`;
    return;
  }

  const cls = {error:"bad", warning:"warn", excluded:"off"};
  const live = liveSessions();
  el.innerHTML = shown.map(p => `
    <div class="row${p.excluded ? " off" : ""}">
      <div class="grow">
        <div class="name">${esc(p.name)}</div>
        ${p.git ? `<div class="sub">git: ${esc(p.git)}</div>` : ""}
        ${p.issues.map(i => i.action && !p.excluded
          // An issue with a fix that takes no decisions says so, and is the
          // control that applies it — underlined, because a line you can click
          // should look like one. Not on an excluded project: nothing acts on
          // one of those until it is let back in, and a link that would refuse
          // is worse than plain text saying what is wrong.
          ? `<div class="sub ${cls[i.level] || ""}"><a href="#" class="fix"
               data-fix="${esc(i.action)}" data-proj="${esc(p.name)}"
               title="runs bb claude-md ${i.action === "claude-md-init" ? "--init" : "--update"
                     } in ${esc(p.name)}"
               >${esc(i.text)}</a></div>`
          : `<div class="sub ${cls[i.level] || ""}">${esc(i.text)}</div>`).join("")}
      </div>
      ${isBroken(p) ? "" : `<button class="${live.has("claude-"+p.name) ? "primary" : ""}"
         data-c="${esc(p.name)}"
         title="${live.has("claude-"+p.name) ? "session running — go to its tab"
                 : p.last_claude ? "no session running — resume or start one"
                 : "start a Claude session here"}">Claude</button>`}
      <button data-s="${esc(p.name)}" title="open another terminal here">Shell</button>
      <button class="eye" data-x="${esc(p.name)}" data-on="${p.excluded ? "0" : "1"}"
        aria-label="${p.excluded ? "include" : "exclude"}"
        title="${p.excluded ? "include — allow Claude sessions here again"
                            : "exclude — block Claude sessions for this directory, and keep it blocked"}"
        >${p.excluded ? EYE : EYE_OFF}</button>
    </div>`).join("");
  el.querySelectorAll("[data-fix]").forEach(a => a.onclick = e => {
    e.preventDefault();
    if (a.dataset.fix === "claude-md-update") claudeMd(a.dataset.proj, "update", a);
    if (a.dataset.fix === "claude-md-init")   claudeMd(a.dataset.proj, "init", a);
  });
  el.querySelectorAll("[data-c]").forEach(b => b.onclick = e => openClaude(b.dataset.c, e));
  el.querySelectorAll("[data-s]").forEach(b => b.onclick = () => newShell(b.dataset.s));
  el.querySelectorAll("[data-x]").forEach(b => b.onclick = () =>
    setExcluded(b.dataset.x, b.dataset.on === "1"));
  // The chooser is positioned against the card, so it is a sibling of the list
  // rather than part of it — replacing the list's innerHTML does not remove it,
  // and without this they stack up one per draw.
  el.closest(".card").querySelectorAll(".resumemenu").forEach(n => n.remove());
  if (resumeFor) placeResumeMenu();
}

// ---- doctor -----------------------------------------------------------
// bb doctor's verdict, run by the server on a slow loop and on the ↻ button.
// Failures and warnings are full lines — they are for reading — while passing
// checks collapse into chips: what a healthy card says is just "all n ok".
// And a healthy card says it folded: header, dot and count, no body — the
// details are one click away and were not worth the sidebar space they took.
let docOpen  = null;   // the operator's toggle; null = follow the verdict
let docLevel = null;   // last verdict, so a change can override that toggle

function drawDoctor(){
  const el = $("doctor"), d = state?.doctor;
  const dot = $("docDot"), tog = $("bDocTog"), card = el.closest(".card");
  $("docWhen").textContent = d?.running ? "running…" : d?.when ? ago(d.when) : "";
  if (!d || !d.when){
    dot.hidden = tog.hidden = true;             // no verdict yet, nothing to fold
    el.hidden = false;
    card.classList.remove("folded");
    el.innerHTML = `<div class="empty">${d?.running ? "running…" : "first run pending…"}</div>`;
    return;
  }
  const tip = c => c.text + (c.detail ? "\n\n" + c.detail : "");
  const probs = d.checks.filter(c => c.level === "FAIL" || c.level === "warn");
  const fine = d.checks.filter(c => c.level === "ok");
  const skip = d.checks.filter(c => c.level === "skip");

  // A changed verdict beats the operator's toggle: a card that turns red must
  // open even if it was folded away green an hour ago, and one that heals
  // folds itself back up rather than squatting on the space it no longer earns.
  const level = probs.some(c => c.level === "FAIL") ? "bad"
              : probs.length ? "warn" : "ok";
  if (level !== docLevel){ docLevel = level; docOpen = null; }
  const open = docOpen ?? (level !== "ok");
  dot.hidden = false;
  dot.className = "st " + level;
  tog.hidden = false;
  tog.textContent = open ? "Hide"
                  : level === "ok" ? `all ${fine.length} ok`
                  : `Show (${probs.length})`;
  el.hidden = !open;
  card.classList.toggle("folded", !open);
  el.innerHTML =
    `<div class="probs">${probs.map(c =>
       `<div class="sub ${c.level === "FAIL" ? "bad" : "warn"}" title="${esc(tip(c))}">${esc(c.text)}</div>`
     ).join("")}</div>` +
    `<div class="chips">${
       fine.map(c => `<span class="pill ok" title="${esc(tip(c))}">${esc(c.text)}</span>`).join("") +
       skip.map(c => `<span class="pill" title="${esc(tip(c))}">${esc(c.text)}</span>`).join("")
     }</div>`;
}

$("bDocTog").onclick = () => { docOpen = $("doctor").hidden; drawDoctor(); };

$("bDoctor").onclick = async () => {
  const b = $("bDoctor");
  if (b.disabled) return;
  b.disabled = true;
  $("docWhen").textContent = "running…";
  try{
    const r = await fetch("/api/doctor", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: "{}"});
    const j = await r.json();
    if (j.error) notify(j.error, true);
    else { if (state) state.doctor = j; drawDoctor(); }
  }catch(e){ notify("doctor failed: " + e, true); }
  b.disabled = false;
  drawDoctor();
};

// ---- commands ---------------------------------------------------------
// Every `bb` command is listed, which is more than fits a sidebar card, so the
// list is cut off and the ones an operator actually uses are pinned above the
// cut. Pins live on the server with the rest of the state — the phone and the
// desktop are looking at one machine and should agree about it.
const COMMANDS_SHOWN = 8;
let showAllCommands = false;

// Side-view thumbtack: cap, body, needle. Filled when pinned, so the state
// reads at a glance without a second icon to learn.
const TACK = `<svg viewBox="0 0 16 16" aria-hidden="true">
  <path d="M5 1.6h6"/>
  <path d="M6.4 1.6v4.1c0 .9-.5 1.4-1.3 1.9-.7.5-1.2 1-1.2 1.6h8.2c0-.6-.5-1.1-1.2-1.6
           -.8-.5-1.3-1-1.3-1.9V1.6"/>
  <path d="M8 9.2v5.2"/></svg>`;

// Pinned first, then the rest — both in the order `bb help` lists them, which
// is the order the server sends. Pinning moves a command up; it does not
// re-sort it into an order the CLI never uses.
function commandOrder(){
  const all = state?.macros || [];
  const pins = new Set(state?.pinned || []);
  return [...all.filter(m => pins.has(m.name)), ...all.filter(m => !pins.has(m.name))];
}

function drawCommands(){
  const el = $("commands"), tog = $("cmdTog");
  const order = commandOrder(), pins = new Set(state?.pinned || []);
  if (!order.length){ el.innerHTML = `<div class="empty">no commands</div>`; return; }

  tog.innerHTML = order.length > COMMANDS_SHOWN
    ? `<button id="bCmds">${showAllCommands ? "Show fewer" : `Show all (${order.length})`}</button>`
    : "";
  if (order.length > COMMANDS_SHOWN)
    $("bCmds").onclick = () => { showAllCommands = !showAllCommands; drawCommands(); };

  const shown = showAllCommands ? order : order.slice(0, COMMANDS_SHOWN);
  el.innerHTML = shown.map(m => {
    const on = pins.has(m.name);
    return `<span class="cmd">
      <button data-m="${esc(m.name)}" title="bb ${esc(m.label)} — runs in the terminal"
        >${esc(m.label)}</button>
      <button class="tack${on ? " on" : ""}" data-tack="${esc(m.name)}"
        data-on="${on ? "1" : "0"}" aria-label="${on ? "unpin" : "pin"}"
        title="${on ? "unpin — let it fall back into the list"
                    : "pin — keep it at the top of this card"}">${TACK}</button>
    </span>`;
  }).join("");
  el.querySelectorAll("[data-m]").forEach(b => b.onclick = () => macro(b.dataset.m));
  el.querySelectorAll("[data-tack]").forEach(b => b.onclick = () =>
    setPinned(b.dataset.tack, b.dataset.on === "0"));
}

// Create or refresh one project's CLAUDE.md. The link says what it is doing
// while it does it: neither is instant, and a line that looks unchanged invites
// a second click.
async function claudeMd(name, action, link){
  if (link.dataset.busy) return;
  link.dataset.busy = "1";
  const said = link.textContent;
  link.textContent = `${action === "init" ? "creating" : "updating"} ${name}…`;
  try{
    const r = await fetch("/api/claude-md", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify({name, action})});
    const j = await r.json();
    if (j.error){ notify(j.error, true); link.textContent = said; link.dataset.busy = ""; return; }
    notify(action === "init"
      ? `${name}: CLAUDE.md created from the template — fill in the project section at the bottom`
      : `${name}: CLAUDE.md environment block updated — your project notes are untouched`);
  }catch(e){
    notify("could not do that: " + e, true);
    link.textContent = said; link.dataset.busy = "";
    return;
  }
  refresh();                            // the warning goes away on its own
}

// ---- custom commands --------------------------------------------------
// The operator's own lists, typed into the terminal like the bb ones. Kept in
// their own card because they are theirs: the bb card is what the image can do
// and changes with it, this one is what they added and does not.
const PENCIL = `<svg viewBox="0 0 16 16" aria-hidden="true">
  <path d="M11.3 2.2 13.8 4.7 5.6 12.9 2.4 13.6 3.1 10.4z"/>
  <path d="M9.9 3.6 12.4 6.1"/></svg>`;

function drawCustom(){
  const el = $("custom"), list = state?.custom || [];
  if (!list.length){
    el.innerHTML = `<div class="empty">none yet — add one with +</div>`;
    return;
  }
  el.innerHTML = list.map(m => {
    // The full title and what it will run, for the hover: a one-word title is
    // no help six months later when you have forgotten what it does.
    const tip = `${m.title}\n\n${m.lines.join("\n")}`;
    return `<span class="cmd">
      <button class="run" data-run="${esc(m.id)}" title="${esc(tip)}">${esc(m.title)}</button>
      <button class="tack" data-edit="${esc(m.id)}" aria-label="edit"
        title="edit or delete">${PENCIL}</button>
    </span>`;
  }).join("");
  el.querySelectorAll("[data-run]").forEach(b => b.onclick = () => macro(null, b.dataset.run));
  el.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => editCustom(b.dataset.edit));
}

let editing = null;

function editCustom(id){
  const m = (state?.custom || []).find(x => x.id === id) || null;
  editing = m?.id || null;
  $("mTitle").textContent = m ? "Edit custom command" : "New custom command";
  $("mName").value = m?.title || "";
  $("mBody").value = (m?.lines || []).join("\n");
  $("mDelete").hidden = !m;
  $("modal").hidden = false;
  $("mName").focus();
  $("mName").select();
}

function closeEditor(){ $("modal").hidden = true; editing = null; }

async function postCustom(body){
  try{
    const r = await fetch("/api/custom", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
    const j = await r.json();
    if (j.error){ notify(j.error, true); return false; }
    if (state) state.custom = j.custom;
    drawCustom();
    return true;
  }catch(e){ notify("could not save it: " + e, true); return false; }
}

async function setPinned(name, on){
  try{
    const r = await fetch("/api/pin", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({name, pinned:on})});
    const j = await r.json();
    if (j.error){ notify(j.error, true); return; }
    // The server's answer is the truth, so two browsers cannot disagree about
    // what is pinned until the next poll.
    if (state) state.pinned = j.pinned;
    drawCommands();
  }catch(e){ notify("could not save the pin: " + e, true); }
}

// Each icon shows the ACTION, not the state: a struck-through eye on a visible
// project means "exclude this", a plain eye on an excluded one means "let it
// back in".
const EYE_PATH = `<path d="M1 8s2.7-4.5 7-4.5S15 8 15 8s-2.7 4.5-7 4.5S1 8 1 8z"/>
  <circle cx="8" cy="8" r="2.1"/>`;
const EYE = `<svg viewBox="0 0 16 16" aria-hidden="true">${EYE_PATH}</svg>`;
const EYE_OFF = `<svg viewBox="0 0 16 16" aria-hidden="true">${EYE_PATH}
  <path d="M2.5 13.5 13.5 2.5"/></svg>`;

// Which project's resume chooser is open, if any.
let resumeFor = null;

const ago = s => {
  const d = Math.max(0, Math.floor(Date.now()/1000) - s);
  return d < 90 ? "just now"
       : d < 5400 ? `${Math.round(d/60)} min ago`
       : d < 172800 ? `${Math.round(d/3600)} h ago`
       : `${Math.round(d/86400)} days ago`;
};

// A live session is simply resumed by attaching — its tab is the conversation.
// The choice only arises when nothing is running but a transcript survives,
// which is exactly what a container restart leaves behind.
function openClaude(name, ev){
  ev?.stopPropagation();
  const p = (state?.projects || []).find(x => x.name === name);
  if (liveSessions().has("claude-" + name) || !p?.last_claude){
    resumeFor = null;
    return startClaude(name, null);
  }
  resumeFor = resumeFor === name ? null : name;
  drawProjects(state.projects);
}

function startClaude(name, sessionId){
  resumeFor = null;
  // Redraw the card, not just the tabs: the chooser is a child of it and would
  // otherwise sit there until the next poll, over a choice already made.
  if (state) drawProjects(state.projects);
  openTab({kind:"term",
           arg: sessionId ? `claude:${name}:r:${sessionId}` : `claude:${name}`,
           label:`Claude: ${name}`});
}

function placeResumeMenu(){
  const p = (state?.projects || []).find(x => x.name === resumeFor);
  const anchor = $("projects").querySelector(`[data-c="${CSS.escape(resumeFor)}"]`);
  if (!p?.last_claude || !anchor){ resumeFor = null; return; }
  const card = anchor.closest(".card");
  const m = document.createElement("div");
  m.className = "pinmenu resumemenu";
  m.id = "resumemenu";
  m.innerHTML =
    `<button data-r="1">Resume — ${esc(p.last_claude.was_open
        ? "open when the container stopped" : ago(p.last_claude.when))}</button>` +
    `<button data-n="1">New conversation</button>`;
  card.appendChild(m);
  const a = anchor.getBoundingClientRect(), c = card.getBoundingClientRect();
  m.style.left = Math.max(4, Math.min(a.left - c.left, c.width - m.offsetWidth - 4)) + "px";
  m.style.top = (a.bottom - c.top + 4) + "px";
  m.querySelector("[data-r]").onclick = () => startClaude(p.name, p.last_claude.id);
  m.querySelector("[data-n]").onclick = () => startClaude(p.name, null);
}

async function setExcluded(name, on){
  if (on && !confirm(`Exclude ${name}?\n\nNo Claude session will be able to start `
        + `here, and any running one ends now. A shell is still available, and `
        + `Include reverses this.`)) return;
  try{
    const r = await fetch("/api/exclude", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({name, excluded:on})});
    const j = await r.json();
    if (j.error){ notify(j.error, true); return; }
    // The server ends a running session when excluding; drop its tab too, or
    // the page keeps offering a terminal onto something that is gone.
    if (j.killed){
      const t = tabs.find(x => x.kind === "term" && sessionOf(x.arg) === j.killed);
      if (t) dropTab(t.id);
    }
  }catch(e){ notify("exclude failed: " + e, true); }
  refresh();
}

// A session tmux knows as "claude-Foo" is the same thing the Projects card
// opens as "claude:Foo". Opening it under the raw name takes bb-tty's fallback
// branch — a bare shell at /workspace, skipping the project directory, the
// exclusion check and the scoped settings — which is only invisible while the
// session already exists. Map it back when the project is one we know.
function argForSession(name){
  const known = new Set((state?.projects || []).map(p => p.name));
  // An exact project match wins, so a project genuinely called "web-2" is not
  // read as terminal 2 of a project called "web".
  for (const [prefix, arg] of [["claude-", "claude:"], ["shell-", "shell:"]])
    if (name.startsWith(prefix) && known.has(name.slice(prefix.length)))
      return arg + name.slice(prefix.length);
  // shell-<project>-<n> and shell-<n>, the numbered terminals.
  const m = /^shell-(?:(.+)-)?(\d+)$/.exec(name);
  if (m && (!m[1] || known.has(m[1]))) return `sh:${m[2]}:${m[1] || ""}`;
  return name;
}

function drawSessions(ss){
  const el = $("sessions");
  if (!ss.length){ el.innerHTML = '<div class="empty">no tmux sessions — nothing is running</div>'; return; }
  // Named exactly as its tab is — the tmux name and the full path are on hover,
  // where the detail belongs.
  const names = sessionLabels();
  el.innerHTML = ss.map(s => `
    <div class="row">
      <div class="grow"><span class="name" title="${esc(s.name + (s.cwd ? " — " + s.cwd : ""))}"
        >${stateDot(s.claude)}${esc(names.get(s.name) || s.name)}</span>
        <span class="pill ${s.attached?"ok":""}">${s.attached?"attached":"detached"}</span>
        ${s.claude?.task ? `<div class="sub" title="${esc(s.claude.task)}">${
          s.claude.state === "working" ? "working on" : "done"}: ${esc(s.claude.task)}</div>` : ""}</div>
      <button data-a="${esc(s.name)}">Open</button>
      <button data-k="${esc(s.name)}" title="end this session">✕</button>
    </div>`).join("");
  el.querySelectorAll("[data-a]").forEach(b => b.onclick = () =>
    openTab({kind:"term", arg:argForSession(b.dataset.a), label:b.dataset.a}));
  // Closing a terminal tab leaves its session running, so this is where one
  // actually gets ended — otherwise they would only ever accumulate.
  el.querySelectorAll("[data-k]").forEach(b => b.onclick = () => killSession(b.dataset.k));
}

async function killSession(name){
  const claude = name.startsWith("claude-");
  if (!confirm(claude
        ? `End the Claude session "${name}"?\n\nThe transcript is kept and can be `
          + `resumed later, but the conversation stops now.`
        : `End the session "${name}"?\n\nAnything running in it is terminated.`)) return;
  try{
    const r = await fetch("/api/session", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({action:"kill", session:name})});
    const j = await r.json();
    if (j.error){ notify(j.error, true); return; }
    // Its tab, if one is open, is now pointing at nothing.
    const t = tabs.find(x => x.kind === "term" && sessionOf(x.arg) === name);
    if (t) dropTab(t.id);
    notify(`ended ${name}`);
  }catch(e){ notify("could not end it: " + e, true); }
  refresh();
}

let toastTimer = null;
function notify(msg, bad){
  const el = $("toast");
  el.textContent = msg;
  el.classList.toggle("bad", !!bad);
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), bad ? 7000 : 4000);
}

// Where a macro should be typed. The active tab if it is a shell — never a
// Claude one, where the command would not run at all but be submitted as a
// prompt — otherwise any open shell tab. There may be none: the workspace tab
// is closable now, so the caller opens a terminal instead of assuming one.
function macroTarget(){
  const here = tabOf(panes[active]);
  if (here && here.kind === "term" && !isClaude(here)) return here;
  return tabs.find(t => t.kind === "term" && !isClaude(t)) || null;
}

// Macros run in a terminal rather than reporting into a pane of their own: the
// output belongs where the operator can scroll it, page it, and follow a
// `bb runner stop` that takes a minute — none of which a one-shot text box did.
async function macro(name, custom){
  const t = macroTarget();
  if (!t){
    newShell("");
    notify("Opening a terminal — press the button again once it is up.");
    return;
  }
  const session = sessionOf(t.arg);
  focusTab(t.id);
  if (!liveSessions().has(session)){
    // The iframe was only just created; tmux has not registered it yet.
    notify(`Opening ${tabLabel(t)} — press the button again once it is up.`);
    return;
  }
  try{
    const r = await fetch("/api/send", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(custom ? {session, custom} : {session, macro:name})});
    const j = await r.json();
    if (j.error) notify(j.error, true);
    else notify(`${j.sent} → ${tabLabel(t)}`);
  }catch(e){ notify("could not reach the dashboard: " + e, true); }
  refresh();
}

function render(){ drawTabs(); drawPanes(); drawKeys(); saveLayout(); }

// ---- layout, shared between browsers ---------------------------------
// The tab strip lives on the server so a phone picks up what the desktop has
// open. `myRev` is the revision this client last wrote or adopted; a status
// poll carrying a different one means another browser changed something.
let myRev = -1, savePending = false, saveTimer = null, adopting = false;

function layoutNow(){
  return {tabs: tabs.map(t => ({id:t.id, kind:t.kind, arg:t.arg,
                                label:t.label})),
          panes, active};
}

function saveLayout(){
  if (adopting) return;                 // echoing back what we were just given
  const body = JSON.stringify(layoutNow());
  if (body === lastSaved) return;       // render() runs on every poll
  lastSaved = body;
  savePending = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try{
      const r = await fetch("/api/layout", {method:"POST",
        headers:{"Content-Type":"application/json"}, body});
      const j = await r.json();
      if (typeof j.rev === "number") myRev = j.rev;
    }catch(e){ /* the next change retries */ }
    savePending = false;
  }, 400);
}
let lastSaved = null;

// Take on a layout another browser wrote. Terminal tabs restore themselves —
// bb-tty attaches to the session if it is still there and recreates it in the
// same directory if it is not.
function adoptLayout(v){
  if (!v || v.rev === myRev || savePending) return;
  // Revision 0 with nothing in it is a server that has never been written to,
  // not an operator who closed every tab — keep the default strip rather than
  // adopting the void. A strip the operator deliberately emptied was saved,
  // which bumped the revision, so it still propagates.
  if (v.rev === 0 && !v.tabs.length){ myRev = v.rev; return; }
  myRev = v.rev;
  adopting = true;
  // Taken whole, workspace tab included — it is an ordinary tab now, so a
  // browser that closed it must not have it resurrected by this one. The map
  // also quietly drops the `fixed` flag a layout saved by the older page has.
  tabs = v.tabs.map(t => ({id:t.id, kind:t.kind, arg:t.arg, label:t.label}));
  // Ids come back from another browser's counter; keep ours ahead of them so a
  // tab opened here cannot collide with one opened there.
  for (const t of tabs){
    const n = parseInt(String(t.id).replace(/^t/, ""), 10);
    if (Number.isFinite(n) && n > seq) seq = n;
  }
  const ids = new Set(tabs.map(t => t.id));
  panes = [ids.has(v.panes[0]) ? v.panes[0] : (tabs[0]?.id ?? null),
           ids.has(v.panes[1]) ? v.panes[1] : null];
  if (panes[1] === panes[0]) panes[1] = null;
  active = panes[1] && v.active === 1 ? 1 : 0;
  lastSaved = JSON.stringify(layoutNow());
  render();
  adopting = false;
}

async function refresh(){
  try{
    const r = await fetch("/api/status");
    if (!r.ok) throw new Error("HTTP " + r.status);
    state = await r.json();
    $("dot").classList.remove("off");
    $("host").textContent = state.host;
    $("uptime").textContent = "up " + state.uptime;
    adoptLayout(state.layout);
    drawRunner(state.runner);
    drawProjects(state.projects);
    drawSessions(state.sessions);
    drawCommands();
    drawCustom();
    drawDoctor();
    $("cardFindings").hidden = !state.reports;
    // A scan re-ran on the host: refresh any open findings view to match.
    if (findings && !findings.loading && findingsMtime !== null
        && state.reports_mtime !== findingsMtime
        && tabs.some(t => t.kind === "findings"))
      loadFindings(true);
    render();
  }catch(e){ $("dot").classList.add("off"); }
}

// Findings opens as a document tab, not a terminal — it is a report to read,
// and piping it through a PTY would only make it harder to.
function openFindings(){
  openTab({kind:"findings", arg:"__findings", label:"findings"});
}

// Both popup menus dismiss on a click that is neither in them nor on the
// control that opened them.
document.addEventListener("click", e => {
  if (pinFor && !e.target.closest(".pinmenu") && !e.target.closest("[data-pin]")){
    pinFor = null; drawTabs();
  }
  if (resumeFor && !e.target.closest(".resumemenu") && !e.target.closest("[data-c]")){
    resumeFor = null;
    if (state) drawProjects(state.projects);
  }
});

$("bAdd").onclick = () => editCustom(null);
$("mCancel").onclick = closeEditor;
$("mSave").onclick = async () => {
  if (await postCustom({action:"save", id: editing,
                        title: $("mName").value, body: $("mBody").value}))
    closeEditor();
};
$("mDelete").onclick = async () => {
  if (!editing || !confirm(`Delete "${$("mName").value}"?`)) return;
  if (await postCustom({action:"delete", id: editing})) closeEditor();
};
// The backdrop and Escape both mean "never mind"; Enter in the title field
// means "save", because a one-line field with a Save button below it does.
$("modal").onclick = e => { if (e.target.id === "modal") closeEditor(); };
$("mName").onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); $("mSave").click(); } };
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("modal").hidden) closeEditor();
});

refresh();
setInterval(refresh, 15000);
</script>
