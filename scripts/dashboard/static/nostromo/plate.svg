<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Hull plating behind the page: two staggered plates per tile, seams,
       rivets and one vent grille. Tiles seamlessly at 120px. The opacity is
       baked in here (a body background cannot fade one layer), and it is
       held to a fifth: this sits behind a page somebody reads code on. -->
  <g opacity="0.2" stroke="#ffb000" fill="#ffb000">
    <g fill="none" stroke-width="1">
      <path d="M0 0.5H120M0 60.5H120M40.5 0V60M100.5 60V120"/>
      <path d="M0 30.5H40M100 90.5H120" stroke-opacity="0.4"/>
      <path d="M56 20H92M56 26H92M56 32H92M56 38H92" stroke-opacity="0.6"/>
    </g>
    <g stroke="none">
      <circle cx="6" cy="6" r="1.4"/><circle cx="34" cy="6" r="1.4"/><circle cx="6" cy="54" r="1.4"/><circle cx="34" cy="54" r="1.4"/>
      <circle cx="46" cy="6" r="1.4"/><circle cx="114" cy="6" r="1.4"/><circle cx="46" cy="54" r="1.4"/><circle cx="114" cy="54" r="1.4"/>
      <circle cx="6" cy="66" r="1.4"/><circle cx="94" cy="66" r="1.4"/><circle cx="6" cy="114" r="1.4"/><circle cx="94" cy="114" r="1.4"/>
      <circle cx="106" cy="66" r="1.4"/><circle cx="114" cy="66" r="1.4"/><circle cx="106" cy="114" r="1.4"/><circle cx="114" cy="114" r="1.4"/>
    </g>
  </g>
</svg>
