<svg xmlns="http://www.w3.org/2000/svg" width="420" height="26" viewBox="0 0 420 26">
  <!-- The dark half's ceiling, for the header's empty middle: two runs of
       silver pipe, lit along their tops, held by clamps, and an amber lamp
       between them every 420px. -->
  <defs>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c232b"/>
      <stop offset="0.28" stop-color="#9fb0bf"/>
      <stop offset="0.42" stop-color="#e3ebf2"/>
      <stop offset="0.7" stop-color="#4f5d6a"/>
      <stop offset="1" stop-color="#151a20"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffc233" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g opacity="0.5">
    <rect x="0" y="2" width="420" height="10" fill="url(#pipe)"/>
    <rect x="0" y="14" width="420" height="10" fill="url(#pipe)"/>
    <g fill="#0f1419" stroke="#6b7a88" stroke-width="0.8">
      <rect x="60.5" y="0.5" width="9" height="25" rx="1.5"/>
      <rect x="350.5" y="0.5" width="9" height="25" rx="1.5"/>
    </g>
  </g>
  <circle cx="210" cy="13" r="13" fill="url(#glow)" opacity="0.55"/>
  <rect x="204.5" y="6.5" width="11" height="13" rx="3.5" fill="#ffb000" fill-opacity="0.85" stroke="#7a5200"/>
  <path d="M206 10.5h8M206 13.5h8M206 16.5h8" stroke="#7a5200" stroke-opacity="0.6"/>
</svg>
