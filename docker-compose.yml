# BuilderBot — Claude Code workstation + GitHub Actions runner for Unraid.
#
#   docker compose up -d
#   docker exec -it builderbot claude
#
# Settings live in .env next to this file (copy .env.example).

services:
  builderbot:
    image: ghcr.io/stencil-projects/builderbot:${BUILDERBOT_TAG:-latest}
    # Building locally instead of pulling? Comment out `image:` above and
    # uncomment this block (or keep both to build and tag in one step).
    # build:
    #   context: .
    #   args:
    #     RUNNER_VERSION: latest
    # Same name the Unraid template uses, so every `docker exec -it
    # BuilderBot ...` command in the docs works under either install method.
    container_name: BuilderBot
    hostname: builderbot
    restart: unless-stopped

    # Keeps a TTY attached so `docker exec -it builderbot claude` behaves like a
    # real terminal.
    stdin_open: true
    tty: true

    environment:
      # --- Unraid file ownership -------------------------------------------
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      TZ: ${TZ:-America/New_York}
      # The sandbox VM the Docker manager builds on is a node now, enrolled
      # with a token from the dashboard's Nodes tab — no key here, nothing
      # named here — with its path mapping on its row. DOCKER_HOST and
      # DOCKER_HOST_PATHS are gone with the ssh node kind.
      # See docs/sandbox-vm.md.

      # --- Claude Code ------------------------------------------------------
      # Leave ANTHROPIC_API_KEY empty to log in interactively with a Claude
      # subscription instead (`docker exec -it builderbot bb login`).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AUTO_UPDATE_CLAUDE: ${AUTO_UPDATE_CLAUDE:-true}
      CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}

      # --- GitHub Actions runner -------------------------------------------
      ENABLE_RUNNER: ${ENABLE_RUNNER:-true}
      GITHUB_URL: ${GITHUB_URL:-}
      GITHUB_PAT: ${GITHUB_PAT:-}
      # Token for git/gh *inside* the container. Session-readable by design —
      # scope it to Contents only, never Administration.
      RUNNER_NAME: ${RUNNER_NAME:-builderbot}
      RUNNER_LABELS: ${RUNNER_LABELS:-builderbot,self-hosted,linux,x64,unraid}
      RUNNER_GROUP: ${RUNNER_GROUP:-}
      RUNNER_EPHEMERAL: ${RUNNER_EPHEMERAL:-true}
      RUNNER_WORKDIR: /workspace/_work

      # --- shutdown ---------------------------------------------------------
      # How long a stop may spend deregistering the runner, powering the
      # emulator down and ending Claude sessions. Docker kills the container
      # after ITS timeout regardless — pass `docker stop -t` to match, or on
      # Unraid raise Settings -> Docker -> Docker Stop Timeout.
      SHUTDOWN_GRACE: ${SHUTDOWN_GRACE:-90}
      # Lines of each terminal's screen kept across a restart, and how many
      # boots' logs are kept.
      BB_SESSION_HISTORY: ${BB_SESSION_HISTORY:-2000}
      BB_LOG_KEEP: ${BB_LOG_KEEP:-60}

      # --- git identity -----------------------------------------------------
      GIT_USER_NAME: ${GIT_USER_NAME:-Stencil923}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-124431934+Stencil923@users.noreply.github.com}

      # --- SDK share --------------------------------------------------------
      # Where the downloadable toolchains live inside the container; pairs
      # with the /sdk volume below.
      SDK_ROOT: ${SDK_ROOT:-/sdk}

      # --- role -------------------------------------------------------------
      # `controller` (default) is the management instance; `node` makes this
      # container a worker that enrolls with a controller and runs its jobs.
      # Same image, same template, two instances.
      BUILDERBOT_ROLE: ${BUILDERBOT_ROLE:-controller}
      # Node only, and only until it has enrolled.
      CONTROLLER_URL: ${CONTROLLER_URL:-}
      NODE_TOKEN: ${NODE_TOKEN:-}
      # --- Android emulator -------------------------------------------------
      # Also uncomment the devices: block below for KVM acceleration.
      ENABLE_ANDROID_EMULATOR: ${ENABLE_ANDROID_EMULATOR:-false}
      # `none` keeps Android off this container's SDK store altogether —
      # for the box whose Android work happens on a node. Unset leaves the
      # image's own baseline, which is right when this container builds.
      ANDROID_BASELINE_PLATFORM: ${ANDROID_BASELINE_PLATFORM:-}
      # API levels to keep an emulator image + AVD for, e.g. "34,35,36,37"
      # (Android 14 through 17). Each is ~2GB, downloaded once onto the SDK
      # share below, so an image update never re-fetches them.
      # Start one with: bb emu start 37
      ANDROID_SYSTEM_IMAGES: ${ANDROID_SYSTEM_IMAGES:-36}
      # swiftshader_indirect (default) is software rendering and always works.
      # swangle_indirect is usually faster, still software. host needs a GPU
      # and the nvidia block below.
      ANDROID_EMULATOR_GPU: ${ANDROID_EMULATOR_GPU:-}
      ENABLE_GPU_DISPLAY: ${ENABLE_GPU_DISPLAY:-true}

      # --- nvidia gpu -------------------------------------------------------
      # Only meaningful with the deploy: block below. The default capabilities
      # are compute,utility — which inject CUDA but NOT the GL/EGL/Vulkan
      # drivers, so anything graphical fails with a GPU that nvidia-smi happily
      # reports as present. "all" is what makes -gpu host and hardware ffmpeg
      # reachable. On Unraid, "all" is also fine for NVIDIA_VISIBLE_DEVICES
      # with a single card; with several, use the UUID from the Nvidia-Driver
      # plugin.
      # Empty by default: a controller renders nothing, so claiming the
      # card here takes it from whatever else wants it. Set both on a
      # node container that runs the emulator.
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-}

      # --- web dashboard ----------------------------------------------------
      # Status page plus a browser terminal. DASHBOARD_AUTH seeds the owner
      # account on the first boot that finds none, and is not read again —
      # `bb users` manages accounts after that. Still required to get the
      # first one:
      # this serves an interactive shell into a container holding a loaded
      # ssh-agent and read-write mounts of every project, so it refuses to
      # start without a credential rather than defaulting to open.
      DASHBOARD_AUTH: ${DASHBOARD_AUTH:-}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-7680}
      # Loopback only: the browser reaches terminals through the dashboard
      # port under /term, behind the same single sign-in, so this port is
      # never published. (DASHBOARD_TTYD_PUBLIC_PORT is gone with the second
      # port that needed it.)
      DASHBOARD_TTYD_PORT: ${DASHBOARD_TTYD_PORT:-7681}
      # Ceiling on open dashboard tabs. Each terminal tab is an iframe running
      # a full terminal emulator over its own websocket.
      DASHBOARD_MAX_TABS: ${DASHBOARD_MAX_TABS:-12}
      # How often the dashboard re-runs `bb doctor` in the background (seconds).
      DASHBOARD_DOCTOR_INTERVAL: ${DASHBOARD_DOCTOR_INTERVAL:-1800}

      # --- publishing -------------------------------------------------------
      NPM_TOKEN: ${NPM_TOKEN:-}

      # --- security ---------------------------------------------------------
      # Scrub GITHUB_PAT/RUNNER_TOKEN from what sessions can see (the runner
      # uses the root-only stash instead). Set false only if you want the
      # legacy behavior back (PAT visible, gh auto-authenticated).
      SHIELD_SECRETS: ${SHIELD_SECRETS:-true}

      # --- optional extras --------------------------------------------------
      EXTRA_APT_PACKAGES: ${EXTRA_APT_PACKAGES:-}
      EXTRA_NPM_PACKAGES: ${EXTRA_NPM_PACKAGES:-}
      EXTRA_PIPX_PACKAGES: ${EXTRA_PIPX_PACKAGES:-}
      # Only used with the /unraid-icons mount below: Unraid names the cached
      # icon after the container, which nothing inside one can observe.
      UNRAID_ICON_NAME: ${UNRAID_ICON_NAME:-BuilderBot}

      PROJECT_BOOTSTRAP: ${PROJECT_BOOTSTRAP:-false}
      CHOWN_PROJECTS: ${CHOWN_PROJECTS:-false}

    volumes:
      # --- your projects ----------------------------------------------------
      # The whole folder, not one entry per project: every subfolder of it
      # becomes a project, so adding one no longer means editing this file.
      # Anything wrong with a directory (no git repository, no CLAUDE.md, an
      # ownership the container user cannot work with) is reported on the
      # dashboard rather than silently not showing up.
      - ${WORKSPACE_PATH:-/mnt/user/development/projects}:/workspace

      # --- the SDK share ----------------------------------------------------
      # Android platforms, build-tools, the 800MB emulator and the multi-GB
      # system images, plus any toolchain `bb sdk install` adds. Outside the
      # image on purpose: the container is rebuilt on every update, this is
      # not, so nothing here is ever downloaded twice.
      - ${SDK_PATH:-/mnt/user/development/SDK}:/sdk

      # --- persistent container state --------------------------------------
      # Claude Code login, shell history, npm globals, runner registration.
      - ${APPDATA_PATH:-/mnt/user/appdata/BuilderBot}/home:/home/builder
      # Drop your own *.sh startup hooks in here.
      - ${APPDATA_PATH:-/mnt/user/appdata/BuilderBot}/config:/config
      # Actions runner checkout/work directory.
      - ${APPDATA_PATH:-/mnt/user/appdata/BuilderBot}/work:/workspace/_work

      # Static-analysis reports, READ-ONLY. The scanner stays on the host by
      # design: mounting only its output means nothing in this container can
      # run it, reconfigure it, or rewrite what it found. Read them with
      # `bb findings`.
      # - ${SCANNER_REPORTS_PATH:-/mnt/user/appdata/scanners/reports}:/reports:ro

      # Optional: send the persistent log somewhere else (e.g. an array
      # share). The container auto-detects a /logs mount; without it, logs
      # stay in config/logs.
      # - /mnt/user/logs/builderbot:/logs

      # Cosmetic, Unraid only: Unraid's container-icon cache. With this
      # mounted rw the container drops <name>-icon.png in on every start, and
      # Unraid stops trying to download an icon it cannot reach — it only
      # fetches the Icon URL when its cache is empty.
      # - /var/lib/docker/unraid/images:/unraid-icons

      # Recommended for the runner PAT and git ssh keys: a root-owned
      # (chmod 700) folder with builderbot.env (GITHUB_PAT=...) and an ssh/
      # subfolder of private keys. Secrets provided here are shielded from
      # Claude sessions (keys are served via a root-owned ssh-agent) — the
      # GITHUB_PAT env var above and keys in home/.ssh are not.
      # - /mnt/user/appdata/BuilderBot/secrets:/secrets:ro

      # --- host Docker access (OFF by default) ------------------------------
      # Dev-instance volumes. Its own share
      # rather than a folder in appdata, because Unraid exports and backs up
      # shares and not folders — see the template's note on this setting.
      # Only needed where the daemon is this box's: a sandbox VM mounts the
      # share itself and makes the per-instance directory over there.
      # - ${DEVDATA_PATH:-/mnt/user/bb-sandbox/devdata}:/devdata

    # Hardware acceleration for the Android emulator. Uncomment if your CPU
    # has virtualization enabled (it does if Unraid can run VMs).
    # devices:
    #   - /dev/kvm:/dev/kvm

    # NVIDIA GPU. Needs the NVIDIA Container Toolkit on the host; pair it with
    # NVIDIA_DRIVER_CAPABILITIES above or you get compute only. Verify from
    # inside with: bb doctor
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

    # Web dashboard + browser terminals, one port: terminals are proxied
    # through it under /term, behind the same sign-in.
    # ports:
    #   - "7680:7680"

    # Uncomment to reach the emulator's adb from other machines on your LAN
    # (e.g. Android Studio on your desktop: adb connect tower:5555).
    # ports:
    #   - "5555:5555"

    # Tells the Unraid Compose Manager plugin to adopt this container.
    labels:
      net.unraid.docker.managed: composeman

    healthcheck:
      test: ["CMD", "/opt/builderbot/scripts/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
