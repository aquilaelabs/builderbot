# BuilderBot — Claude Code workstation + GitHub Actions runner for Unraid.
#
#   docker compose up -d
#   docker exec -it builderbot claude
#
# Settings live in .env next to this file (copy .env.example).

services:
  builderbot:
    image: ghcr.io/stencil-projects/builderbot:${BUILDERBOT_TAG:-latest}
    # An install pulls the image; BuilderBot's own dev instance on a node
    # builds this checkout instead, the way any project's dev instance is
    # built from its tree: its env file sets BUILDERBOT_PULL=build and a tag
    # of its own (BUILDERBOT_TAG=dev). With the default policy compose pulls
    # what is missing and never builds unless asked, so `docker compose up`
    # on a fresh install is unchanged.
    build:
      context: .
      # The stamp the header and `bb status` read, and the agents compare
      # their version against. CI passes these three; a dev instance gets
      # them from BuilderBot, which sets BB_BUILD_REV, BB_BUILD_AT and
      # BB_BUILD_VERSION for any compose it builds (the same convention as
      # BB_DEV_DATA). A hand-run `docker compose build` leaves them blank.
      args:
        IMAGE_REV: ${BB_BUILD_REV:-}
        IMAGE_BUILT: ${BB_BUILD_AT:-}
        IMAGE_VERSION: ${BB_BUILD_VERSION:-}
    pull_policy: ${BUILDERBOT_PULL:-missing}
    # Same name the Unraid template uses, so every `docker exec -it
    # BuilderBot ...` command in the docs works under either install method.
    container_name: BuilderBot
    hostname: builderbot
    restart: unless-stopped

    # Keeps a TTY attached so `docker exec -it builderbot claude` behaves like a
    # real terminal.
    stdin_open: true
    tty: true

    environment:
      # --- Unraid file ownership -------------------------------------------
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      TZ: ${TZ:-Etc/UTC}
      # The sandbox VM the Docker manager builds on is a node now, enrolled
      # with a token from the dashboard's Nodes tab — no key here, nothing
      # named here — with its path mapping on its row. DOCKER_HOST and
      # DOCKER_HOST_PATHS are gone with the ssh node kind.
      # See docs/sandbox-vm.md.

      # --- Claude Code ------------------------------------------------------
      # Leave ANTHROPIC_API_KEY empty to log in interactively with a Claude
      # subscription instead (`docker exec -it builderbot bb login`).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # --- shutdown ---------------------------------------------------------
      # How long a stop may spend deregistering the runner, powering the
      # emulator down and ending Claude sessions. Docker kills the container
      # after ITS timeout regardless — pass `docker stop -t` to match, or on
      # Unraid raise Settings -> Docker -> Docker Stop Timeout.
      # Lines of each terminal's screen kept across a restart, and how many
      # boots' logs are kept.

      # --- git identity -----------------------------------------------------

      # --- package store --------------------------------------------------------
      # Where the downloadable toolchains live inside the container; pairs
      # with the /sdk volume below.
      SDK_ROOT: ${SDK_ROOT:-/sdk}

      # --- web dashboard ----------------------------------------------------
      # Status page plus a browser terminal. There is no password here: the
      # first page it serves asks you to make the owner account, and it serves
      # nothing else until you have. Open it as soon as the container is up —
      # this publishes an interactive shell into a container holding a loaded
      # ssh-agent and read-write mounts of every project.
      DASHBOARD_PORT: ${DASHBOARD_PORT:-7680}
      # Loopback only: the browser reaches terminals through the dashboard
      # port under /term, behind the same single sign-in, so this port is
      # never published. (DASHBOARD_TTYD_PUBLIC_PORT is gone with the second
      # port that needed it.)
      DASHBOARD_TTYD_PORT: ${DASHBOARD_TTYD_PORT:-7681}
      # Ceiling on open dashboard tabs. Each terminal tab is an iframe running
      # a full terminal emulator over its own websocket.
      # How often the dashboard re-runs `bb doctor` in the background (seconds).

      # --- publishing -------------------------------------------------------
      NPM_TOKEN: ${NPM_TOKEN:-}

      # --- optional extras --------------------------------------------------
      # Only used with the /unraid-icons mount below: Unraid names the cached
      # icon after the container, which nothing inside one can observe.
      CHOWN_PROJECTS: ${CHOWN_PROJECTS:-false}

    volumes:
      # --- your projects ----------------------------------------------------
      # The whole folder, not one entry per project: every subfolder of it
      # becomes a project, so adding one no longer means editing this file.
      # Anything wrong with a directory (no git repository, no CLAUDE.md, an
      # ownership the container user cannot work with) is reported on the
      # dashboard rather than silently not showing up.
      - ${WORKSPACE_PATH:-/mnt/user/projects}:/workspace

      # --- this checkout, for the container's own tests ---------------------
      # The tree the image was built from, where a `bb devapp test` on the
      # BuilderBot project runs its suite: the exec starts in the directory
      # that carries the project, and this is it once /workspace is a share
      # that does not hold this checkout (a dev instance on its own share,
      # 15 Sep). Outside /workspace on purpose, so it is not a project of
      # this instance's; the image's own copy at /opt/builderbot is laid out
      # for running, not for the suite.
      - .:/opt/builderbot/src

      # --- the package store ----------------------------------------------------
      # Android platforms, build-tools, the 800MB emulator and the multi-GB
      # system images, plus any toolchain `bb packages install` adds. Outside the
      # image on purpose: the container is rebuilt on every update, this is
      # not, so nothing here is ever downloaded twice.
      - ${SDK_PATH:-/mnt/user/sdk}:/sdk

      # --- persistent container state --------------------------------------
      # Claude Code login, shell history, npm globals, runner registration.
      - ${APPDATA_PATH:-/mnt/user/appdata/BuilderBot}/home:/home/builder
      # Drop your own *.sh startup hooks in here.
      - ${APPDATA_PATH:-/mnt/user/appdata/BuilderBot}/config:/config
      # The runners' registration tokens, root-only (0700) by design so a
      # session can never read one. A named volume rather than a directory
      # under /config: on an appdata path that is a squashed NFS share
      # (all_squash, the shape a dev instance of BuilderBot lands on) root
      # cannot own anything, and the store cannot be made at all. Local to
      # the daemon, it survives an update like the rest of /config.
      - runner-tokens:/config/runner-tokens

      # Static-analysis reports, READ-ONLY. The scanner stays on the host by
      # design: mounting only its output means nothing in this container can
      # run it, reconfigure it, or rewrite what it found. Read them with
      # `bb findings`.
      # - ${SCANNER_REPORTS_PATH:-/mnt/user/appdata/scanners/reports}:/reports:ro

      # Optional: send the persistent log somewhere else (e.g. an array
      # share). The container auto-detects a /logs mount; without it, logs
      # stay in config/logs.
      # - /mnt/user/logs/builderbot:/logs

      # Cosmetic, Unraid only: Unraid's container-icon cache. With this
      # mounted rw the container drops <name>-icon.png in on every start, and
      # Unraid stops trying to download an icon it cannot reach — it only
      # fetches the Icon URL when its cache is empty.
      # - /var/lib/docker/unraid/images:/unraid-icons

      # Recommended for git ssh keys and any publishing token: a root-owned
      # (chmod 700) folder with an ssh/ subfolder of private keys and *.env
      # files (NPM_TOKEN=...). Secrets provided here are shielded from Claude
      # sessions (keys are served via a root-owned ssh-agent); keys in
      # home/.ssh are not.
      # - /mnt/user/appdata/BuilderBot/secrets:/secrets:ro

      # --- host Docker access (OFF by default) ------------------------------
      # Dev-instance volumes. Its own share
      # rather than a folder in appdata, because Unraid exports and backs up
      # shares and not folders — see the template's note on this setting.
      # Only needed where the daemon is this box's: a sandbox VM mounts the
      # share itself and makes the per-instance directory over there.
      # - ${DEVDATA_PATH:-/mnt/user/builderbot/devdata}:/devdata

    # Web dashboard + browser terminals, one port: terminals are proxied
    # through it under /term, behind the same sign-in. Published on the same
    # number it listens on, so DASHBOARD_PORT moves both, and a dev instance
    # of BuilderBot on a node is reachable the way any project's is. The
    # terminal port stays inside the container: nothing on the node's own
    # 7681 is touched.
    ports:
      - "${DASHBOARD_PORT:-7680}:${DASHBOARD_PORT:-7680}"

    # Tells the Unraid Compose Manager plugin to adopt this container.
    labels:
      net.unraid.docker.managed: composeman

    healthcheck:
      test: ["CMD", "/opt/builderbot/scripts/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3

  # ---- the lab (roadmap R54): a real Gitea beside a DEV instance ----------
  # Under the `lab` profile, so an ordinary `docker compose up` never starts
  # it: a dev instance of BuilderBot switches it on with COMPOSE_PROFILES=lab
  # in its env file, from the Docker tab like any project's stack, and
  # `bb tests lab` proves the link, unlink and runner paths against it.
  # Nothing here is a secret: it exists to be tested against, and its volume
  # can be thrown away. Actions are on so the runner half can be proved too.
  gitea:
    image: docker.gitea.com/gitea:1.24
    profiles: ["lab"]
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: "http://${BB_LAB_HOST:-127.0.0.1}:3000/"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_DOMAIN: "${BB_LAB_HOST:-127.0.0.1}"
      GITEA__server__SSH_PORT: "2222"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__actions__ENABLED: "true"
      GITEA__log__LEVEL: "Warn"
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - lab-gitea:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
  # One-shot, idempotent: the administrator the lab suites sign in as to
  # mint their own tokens (labadmin / labpassword).
  gitea-seed:
    image: docker.gitea.com/gitea:1.24
    profiles: ["lab"]
    depends_on:
      gitea:
        condition: service_healthy
    user: "1000:1000"
    environment:
      GITEA_WORK_DIR: /data/gitea
      GITEA_CUSTOM: /data/gitea
      HOME: /data/git
    volumes:
      - lab-gitea:/data
    entrypoint:
      - /bin/sh
      - -c
      - >
        gitea --config /data/gitea/conf/app.ini admin user create
        --admin --username labadmin --password labpassword
        --email lab@example.invalid --must-change-password=false
        2>&1 | grep -v 'already exists' || true;
        echo 'lab seeded: labadmin/labpassword'

volumes:
  runner-tokens:
  lab-gitea:
